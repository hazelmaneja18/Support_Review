<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEQAS REVIEW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --pal-yellow:#FDEB9E;
    --pal-mint:#7AE2CF;
    --pal-teal:#077A7D;
    --pal-navy:#06202B;

    --ink:#06202B;
    --ink-2:#0a2e38;
    --ink-soft:#2f4a52;
    --paper:#dceeea;
    --paper-deep:#c7e6de;
    --card:#f8fdfc;
    --rule:#b9d9d1;
    --rule-soft:#cfe6df;
    --brass:#077A7D;
    --brass-dark:#054f51;
    --brass-tint:#c9f0e5;
    --ink-text:#06202B;
    --slate:#33535a;
    --slate-soft:#5f8188;
    --green:#0b5c48;
    --green-bg:#9fe3cf;
    --red:#8f2f2f;
    --red-bg:#f6c9c9;
    --amber:#7a5e10;
    --amber-bg:#FDEB9E;
    --neutral-ink:#2f5560;
    --neutral-bg:#cdebe3;
    --radius:10px;
    --radius-sm:6px;
    --shadow: 0 1px 2px rgba(6,32,43,0.05), 0 4px 16px rgba(6,32,43,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink-text);
    font-family:'Inter', -apple-system, sans-serif;
    font-size:14.5px;
    line-height:1.5;
    min-height:100vh;
  }
  ::selection{ background: var(--brass); color:#fff; }
  .app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:242px;
    flex-shrink:0;
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    border-right:1px solid rgba(255,255,255,0.06);
    color:#dcefe9;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:26px 22px 18px 22px;
    border-bottom:1px solid rgba(255,255,255,0.1);
  }
  .brand .mark{
    display:flex; align-items:center; gap:10px; margin-bottom:6px;
  }
  .brand .seal{
    width:30px;height:30px;border-radius:50%;
    background:rgba(122,226,207,0.14);
    border:1px solid var(--pal-mint);
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px; color:var(--pal-mint);
    flex-shrink:0;
  }
  .brand h1{
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:18px;
    letter-spacing:-0.01em;
    margin:0;
    color:#f2fbf8;
  }
  .brand .tagline{
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#7fa39b;
    margin-top:3px;
  }
  nav.navlist{
    padding:16px 12px;
    flex:1;
    overflow-y:auto;
  }
  .navlist button{
    width:100%;
    display:flex;
    align-items:center;
    gap:11px;
    background:none;
    border:none;
    color:#a9c9c2;
    text-align:left;
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    padding:9px 12px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    letter-spacing:0.01em;
    margin-bottom:2px;
    transition:background 0.15s, color 0.15s;
  }
  .navlist button svg{ flex-shrink:0; opacity:0.75; }
  .navlist button:hover{ background:rgba(255,255,255,0.06); color:#f2fbf8; }
  .navlist button.active{
    background:rgba(122,226,207,0.16);
    color:var(--pal-mint);
    font-weight:600;
    box-shadow: inset 2px 0 0 var(--pal-mint);
  }
  .navlist button.active svg{ opacity:1; }
  .navlist .navgroup-label{
    font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color:#5f7d77; padding:14px 12px 6px 12px; font-weight:600;
  }
  .sidebar-foot{
    padding:14px 22px 18px 22px;
    border-top:1px solid rgba(255,255,255,0.1);
    font-size:11.5px;
    color:#7fa39b;
    display:flex; flex-direction:column; gap:10px;
  }
  .sidebar-foot .month-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    padding:5px 10px;border-radius:20px;
    color:#f2fbf8; font-weight:600; font-size:12px;
    width:fit-content;
  }
  .save-status{
    display:flex; align-items:center; gap:7px; font-size:11px; color:#7fa39b;
  }
  .save-status .dot{
    width:6px; height:6px; border-radius:50%; background:var(--pal-mint); flex-shrink:0;
  }
  .save-status.error{ cursor:pointer; }
  .save-status.error .dot{ background:#ff9d9d; }
  .save-status.saving .dot{ background:var(--pal-yellow); }

  /* ---------- MAIN ---------- */
  .main{ flex:1; min-width:0; }
  .topbar{
    position:sticky; top:0; z-index:5;
    background:rgba(220,238,234,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--rule);
    padding:20px 36px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .topbar h2{
    font-family:'Inter',serif;
    font-size:24px; font-weight:700; margin:0; color:var(--ink);
  }
  .topbar .sub{ color:var(--slate); font-size:12.5px; margin-top:2px;}
  .content{ padding:28px 36px 60px 36px; max-width:1180px; }

  .month-select{
    display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--rule);
    border-radius:20px; padding:6px 6px 6px 14px;
  }
  .month-select label{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--slate-soft); }
  .month-select select{
    border:none; background:none; font-family:'IBM Plex Mono',monospace;
    font-size:13px; font-weight:600; color:var(--ink); padding:4px 6px; cursor:pointer;
  }

  /* ---------- CARDS / COMMON ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--rule-soft);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .card-header{
    padding:16px 20px; border-bottom:1px solid var(--rule-soft);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .card-header h3{ font-family:'Inter',serif; font-size:16.5px; margin:0; font-weight:700; color:var(--ink);}
  .card-body{ padding:20px; }

  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px;}
  .stat-card{
    background:var(--card); border:1px solid var(--rule-soft); border-radius:var(--radius);
    padding:18px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .stat-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--brass);
  }
  .stat-card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--slate-soft); font-weight:600;}
  .stat-card .value{ font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:600; color:var(--ink); margin-top:6px;}
  .stat-card .value small{ font-size:14px; color:var(--slate); font-weight:500;}
  .stat-card .delta{ font-size:12px; margin-top:4px; color:var(--slate);}

  table{ width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--slate-soft); font-weight:700; padding:9px 12px; border-bottom:2px solid var(--rule);
    white-space:nowrap;
  }
  td{ padding:11px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(169,121,58,0.045); }
  .num{ font-family:'IBM Plex Mono',monospace; }
  .agent-name{ font-style:italic; font-weight:500; color:var(--slate); }
  .row-total td{ font-weight:700; background:var(--paper-deep); border-top:2px solid var(--rule); }

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:12.5px; padding:3px 9px; border-radius:20px;
  }
  .badge.green{ background:var(--green-bg); color:var(--green); }
  .badge.amber{ background:var(--amber-bg); color:var(--amber-dark, var(--amber)); }
  .badge.red{ background:var(--red-bg); color:var(--red); }
  .badge.neutral{ background:var(--paper-deep); color:var(--slate); }

  button.btn{
    font-family:inherit; font-weight:600; font-size:13px; border-radius:var(--radius-sm); cursor:pointer;
    padding:9px 16px; border:1px solid transparent; transition:all 0.12s;
  }
  button.btn.primary{ background:var(--ink); color:#eafaf5; }
  button.btn.primary:hover{ background:var(--ink-2); }
  button.btn.brass{ background:var(--brass); color:#fff; }
  button.btn.brass:hover{ background:var(--brass-dark); }
  button.btn.ghost{ background:transparent; border:1px solid var(--rule); color:var(--ink-text); }
  button.btn.ghost:hover{ border-color:var(--slate-soft); }
  button.btn.danger{ background:transparent; color:var(--red); border:1px solid var(--red-bg); }
  button.btn.danger:hover{ background:var(--red-bg); }
  button.btn.sm{ padding:5px 11px; font-size:12px; }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .icon-btn{
    background:none; border:none; cursor:pointer; color:var(--slate); padding:6px; border-radius:var(--radius-sm);
    display:inline-flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background:var(--paper-deep); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--red-bg); color:var(--red); }

  label.field-label{ display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate); margin-bottom:6px;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; font-family:inherit; font-size:13.5px; color:var(--ink-text);
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius-sm); padding:9px 11px;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  textarea{ resize:vertical; min-height:76px; line-height:1.5; }
  .field{ margin-bottom:16px; }
  .field-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .field-hint{ font-size:11.5px; color:var(--slate-soft); margin-top:5px; }

  .crit-card{
    border:1px solid var(--rule-soft); border-left:3px solid var(--rule);
    border-radius:12px; padding:14px 16px; margin-bottom:12px; background:var(--card);
    transition:border-color 0.15s, background 0.15s;
  }
  .crit-card:last-child{ margin-bottom:0; }
  .crit-card[data-band="unscored"]{ border-left-color:var(--rule); }
  .crit-card[data-band="0"]{ border-left-color:var(--red); background:color-mix(in srgb, var(--red-bg) 40%, var(--card)); }
  .crit-card[data-band="1"]{ border-left-color:var(--amber); background:color-mix(in srgb, var(--amber-bg) 40%, var(--card)); }
  .crit-card[data-band="2"]{ border-left-color:var(--green); background:color-mix(in srgb, var(--green-bg) 40%, var(--card)); }
  .crit-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .crit-head .crit-info{ flex:1; min-width:200px; }
  .crit-name{ font-weight:600; color:var(--ink-text); font-size:13.5px; }
  .crit-desc{ font-size:12px; color:var(--slate-soft); margin-top:3px; line-height:1.45; }
  .seg{
    display:flex; border:1px solid var(--rule); border-radius:20px; overflow:hidden; background:var(--card);
    flex-shrink:0;
  }
  .seg button{
    border:none; background:none; padding:8px 14px; font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; font-weight:600; color:var(--slate); cursor:pointer; border-right:1px solid var(--rule);
    white-space:nowrap;
  }
  .seg button:last-child{ border-right:none; }
  .seg button.sel-0.active{ background:var(--red-bg); color:var(--red); }
  .seg button.sel-1.active{ background:var(--amber-bg); color:var(--amber-dark,var(--amber)); }
  .seg button.sel-2.active{ background:var(--green-bg); color:var(--green); }
  .crit-note{ margin-top:10px; }
  .crit-note textarea{
    min-height:52px; font-size:12.5px; padding:8px 10px; background:var(--card);
  }
  .crit-note .note-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate-soft);
    font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:6px;
  }
  .crit-note .note-label .req-dot{
    width:5px; height:5px; border-radius:50%; background:var(--rule); display:inline-block;
  }
  .crit-card[data-band="0"] .note-label .req-dot{ background:var(--red); }
  .crit-card[data-band="1"] .note-label .req-dot{ background:var(--amber); }
  .crit-card[data-band="2"] .note-label .req-dot{ background:var(--green); }
  .crit-info-toggle{
    background:none; border:none; cursor:pointer; font-family:inherit; font-size:11px;
    font-weight:600; color:var(--brass); padding:6px 0 0 0; letter-spacing:0.02em;
  }
  .crit-info-toggle:hover{ color:var(--brass-dark); text-decoration:underline; }
  .crit-info-panel{
    display:none; margin-top:8px; background:var(--neutral-bg); border:1px solid var(--rule);
    border-radius:var(--radius-sm); padding:10px 13px; font-size:11.5px; line-height:1.6; color:var(--neutral-ink);
    white-space:pre-line;
  }
  .crit-info-panel.open{ display:block; }
  .prev-reviews{
    background:var(--brass-tint); border:1px solid var(--rule); border-radius:var(--radius);
    padding:14px 18px; margin:18px 0; font-size:13px;
  }
  .prev-reviews .prev-title{
    font-size:11px; text-transform:uppercase; letter-spacing:0.08em; font-weight:700;
    color:var(--brass-dark); margin-bottom:8px;
  }
  .prev-reviews .prev-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:6px 0; border-top:1px solid rgba(0,0,0,0.06);
  }
  .prev-reviews .prev-item:first-of-type{ border-top:none; }
  .prev-reviews .prev-item .agent-name{ color:var(--slate); }
  .summary-actions{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--paper-deep); border:1px solid var(--rule-soft); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:18px;
  }
  .summary-actions p{ margin:0; font-size:12.5px; color:var(--slate); max-width:520px; }
  .gen-note{ font-size:11.5px; color:var(--slate-soft); margin-top:8px; }

  .total-strip{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:var(--ink); color:#eafaf5; border-radius:12px; padding:16px 22px; margin:20px 0;
  }
  .total-strip .tlabel{ font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:#9dc3ba;}
  .total-strip .tval{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; }
  .total-strip .tval small{ font-size:14px; font-weight:500; color:#a9d3c9;}

  .letterhead{
    border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; background:var(--card);
  }
  .letterhead .lh-band{
    background:var(--ink); color:#eafaf5; padding:16px 22px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .letterhead .lh-band h4{ margin:0; font-family:'Inter',serif; font-size:16px; font-weight:700;}
  .letterhead .lh-body{ padding:20px 22px; }
  .kv-table{ width:100%; border-collapse:collapse; }
  .kv-table td{ padding:8px 12px; border:1px solid var(--rule); font-size:13px; }
  .kv-table td.k{ background:var(--paper-deep); font-weight:700; width:210px; text-transform:uppercase; font-size:11px; letter-spacing:0.04em; color:var(--slate); }

  .section-block{ margin-top:18px; }
  .section-block h5{
    font-family:'Inter',serif; font-size:14px; margin:0 0 6px 0; color:var(--ink); font-weight:700;
    border-bottom:1.5px solid var(--brass); padding-bottom:5px; display:inline-block;
  }
  .section-block p{ margin:8px 0 0 0; color:var(--ink-text); white-space:pre-wrap; }

  .empty-state{
    text-align:center; padding:56px 20px; color:var(--slate-soft);
  }
  .empty-state svg{ opacity:0.5; margin-bottom:12px; }
  .empty-state h4{ font-family:'Inter',serif; color:var(--ink); font-size:17px; margin:0 0 6px 0; }
  .empty-state p{ font-size:13px; margin:0 0 18px 0; }

  .toast-wrap{ position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
  .toast{
    background:var(--ink); color:#eafaf5; padding:12px 18px; border-radius:10px; font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); display:flex; align-items:center; gap:10px;
    border-left:3px solid var(--brass);
    animation: slidein 0.25s ease-out;
  }
  @keyframes slidein{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,29,49,0.55); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 20px; z-index:100; overflow-y:auto;
  }
  .modal{
    background:var(--paper); border-radius:5px; width:100%; max-width:680px; box-shadow:0 20px 60px rgba(0,0,0,0.35);
    border:1px solid var(--rule);
  }
  .modal-head{
    padding:18px 24px; border-bottom:1px solid var(--rule); display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h3{ font-family:'Inter',serif; margin:0; font-size:18px;}
  .modal-body{ padding:22px 24px; max-height:70vh; overflow-y:auto;}
  .modal-foot{ padding:16px 24px; border-top:1px solid var(--rule); display:flex; justify-content:flex-end; gap:10px;}

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .support-chip{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--rule-soft);
    padding:9px 8px 9px 14px; border-radius:20px; font-size:13px; font-weight:600; box-shadow:var(--shadow);
  }
  .support-chip .initial{
    width:22px;height:22px;border-radius:50%; background:var(--ink); color:#eafaf5; display:flex;
    align-items:center; justify-content:center; font-size:10.5px; font-family:'Inter',serif; font-weight:700;
  }

  .filter-bar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .filter-bar select, .filter-bar input{ width:auto; }

  .count-table th:not(:first-child){ text-align:center; }
  .count-table td.num{ text-align:center; }
  .target-input{
    width:64px !important; text-align:center; padding:6px 4px !important; font-family:'IBM Plex Mono',monospace;
    font-weight:600; display:inline-block;
  }

  .loading-screen{
    position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; z-index:999;
  }
  .loading-screen .seal-lg{
    width:52px;height:52px;border-radius:50%; border:2px solid var(--brass); display:flex; align-items:center;
    justify-content:center; font-family:'Inter',serif; font-weight:700; font-size:20px; color:var(--brass);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:0.4;} }
  .loading-screen p{ color:var(--slate); font-size:13px; letter-spacing:0.04em;}

  ::-webkit-scrollbar{ width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:6px;}
  ::-webkit-scrollbar-track{ background:transparent;}

  @media (max-width: 880px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; align-items:center; overflow-x:auto;}
    .brand{ border-bottom:none; padding:14px 16px;}
    nav.navlist{ display:flex; padding:8px; }
    .sidebar-foot{ display:none; }
    .content{ padding:20px 16px 60px; }
    .topbar{ padding:16px; flex-direction:column; align-items:flex-start; gap:10px;}
    .stat-row{ grid-template-columns:1fr; }
    .field-grid{ grid-template-columns:1fr; }
    .crit-head{ flex-direction:column; align-items:stretch; }
    .seg{ width:100%; }
    .seg button{ flex:1; }
  }
</style>
</head>
<body>

<div id="loading" class="loading-screen">
  <div class="seal-lg">SR</div>
  <p>Loading your saved reviews…</p>
</div>

<div class="app" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <div class="seal">SR</div>
        <h1>SEQAS REVIEW</h1>
      </div>

  { supportName:'Gemmalyn Silvestre', aliases:['Gemmalyn Pamat'], month:'2026-08', dateOfEval:'2026-08-24', chatDate:'2026-08-21', agentName:'James Querubin', caseNumber:'13930960',

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

let STATE = {
  supports: [],
  targets: {},
  records: [],
  seededAugust2026: false,
  deletedCaseNumbers: []
};
let currentView = 'dashboard';
let currentMonth = monthKey(new Date());
let editingRecordId = null;

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(mk){ const [y,m]=mk.split('-').map(Number); return MONTH_NAMES[m-1]+' '+y; }
function monthShort(mk){ const [y,m]=mk.split('-').map(Number); return MONTH_ABBR[m-1]+' '+y; }
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}); }

/* ---------------------- PERSISTENCE ---------------------- */
function setSaveStatus(state, text){
  const wrap = document.getElementById('saveStatus');
  const label = document.getElementById('saveStatusText');
  if(!wrap || !label) return;
  wrap.classList.remove('saving','error');
  if(state) wrap.classList.add(state);
  label.textContent = text;
}
async function loadState(){
  try{
    const res = await window.storage.get('app-data', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      STATE.supports = parsed.supports || [];
      STATE.targets = parsed.targets || {};
      STATE.records = parsed.records || [];
      STATE.seededAugust2026 = !!parsed.seededAugust2026;
      STATE.deletedCaseNumbers = parsed.deletedCaseNumbers || [];
      setSaveStatus(null, 'All changes saved');
    } else {
      STATE = seedState();
      await saveState();
    }
  }catch(e){
    STATE = seedState();
    try{ await saveState(); }catch(e2){ console.error('Initial save failed', e2); }
  }
}
async function saveState(attempt=1){
  setSaveStatus('saving', attempt>1 ? `Saving… (retry ${attempt-1})` : 'Saving…');
  try{
    const result = await window.storage.set('app-data', JSON.stringify(STATE), false);
    if(!result){
      throw new Error('Storage returned no result');
    }
    const stamp = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    setSaveStatus(null, `Saved at ${stamp}`);
    return true;
  }catch(e){
    console.error('Storage error (attempt '+attempt+')', e);
    if(attempt < 3){
      await new Promise(res=>setTimeout(res, 400*attempt));
      return saveState(attempt+1);
    }
    setSaveStatus('error', 'Not saved — tap to retry');
    toastRetry('Could not save your last change. Tap here to try again.');
    return false;
  }
}
function seedState(){
  const names = ['Aj Dela Cruz','Kristian Ong','Melvin Lagrosa','Zachary Payabyab','Glory Barbacena','Gemmalyn Silvestre','Judy Tolentino','Christian Mark Patdu'];
  return {
    supports: names.map(n=>({ id: uid('sup'), name:n })),
    targets: {},
    records: [],
    seededAugust2026: false,
    deletedCaseNumbers: []
  };
}
function findOrCreateSupport(canonicalName, aliases){
  let sup = STATE.supports.find(s=>s.name.toLowerCase()===canonicalName.toLowerCase());
  if(!sup){
    for(const alias of (aliases||[])){
      sup = STATE.supports.find(s=>s.name.toLowerCase()===alias.toLowerCase());
      if(sup){ sup.name = canonicalName; break; }
    }
  }
  if(!sup){ sup = { id: uid('sup'), name: canonicalName }; STATE.supports.push(sup); }
  return sup;
}
async function ensureAugustSeed(){
  if(STATE.seededAugust2026) return;
  const existingCases = new Set(STATE.records.map(r=>String(r.caseNumber)));
  const deletedCases = new Set((STATE.deletedCaseNumbers||[]).map(String));
  AUGUST_2026_SEED.forEach(entry=>{
    if(existingCases.has(String(entry.caseNumber))) return;
    if(deletedCases.has(String(entry.caseNumber))) return;
    const sup = findOrCreateSupport(entry.supportName, entry.aliases);
    const total = Object.values(entry.scores).reduce((s,v)=>s+v,0);
    STATE.records.push({
      id: uid('rec'),
      month: entry.month,
      supportId: sup.id,
      supportName: sup.name,
      dateOfEval: entry.dateOfEval,
      chatDate: entry.chatDate,
      agentName: entry.agentName,
      caseNumber: entry.caseNumber,
      scores: entry.scores,
      criteriaNotes: entry.criteriaNotes || {},
      total,
      percent: total / MAX_SCORE,
      supportAction: entry.supportAction,
      commitmentObservations: entry.commitmentObservations,
      additionalActions: entry.additionalActions,
      tlCommitment: entry.tlCommitment,
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
  });
  STATE.seededAugust2026 = true;
  await saveState();
}
// Backfills per-criterion notes on August records that were seeded before
// notes existed, without touching anything the person has since edited.
async function ensureAugustNotes(){
  let changed = false;
  AUGUST_2026_SEED.forEach(entry=>{
    if(!entry.criteriaNotes) return;
    const rec = STATE.records.find(r=>String(r.caseNumber)===String(entry.caseNumber));
    if(!rec) return;
    const hasNotes = rec.criteriaNotes && Object.values(rec.criteriaNotes).some(v=>v && v.trim());
    if(!hasNotes){
      rec.criteriaNotes = { ...entry.criteriaNotes };
      changed = true;
    }
  });
  if(changed) await saveState();
}

/* ---------------------- DERIVED HELPERS ---------------------- */
function allMonthsUsed(){
  const set = new Set(STATE.records.map(r=>r.month));
  set.add(currentMonth);
  const now = new Date();
  set.add(monthKey(now));
  return Array.from(set).sort();
}
function recordsFor(month, supportId){
  return STATE.records.filter(r=>r.month===month && (!supportId || r.supportId===supportId))
    .sort((a,b)=> (a.createdAt||0)-(b.createdAt||0));
}
function avgPercent(recs){
  if(!recs.length) return null;
  return recs.reduce((s,r)=>s+r.percent,0)/recs.length;
}
function sortedSupports(){
  return [...STATE.supports].sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:'base'}));
}
function getTarget(month){
  if(STATE.targets[month] !== undefined) return STATE.targets[month];
  return 16;
}
function scoreBadgeClass(pct){
  if(pct===null || pct===undefined) return 'neutral';
  if(pct>=0.85) return 'green';
  if(pct>=0.70) return 'amber';
  return 'red';
}
function pctStr(p){ return p===null||p===undefined ? '—' : Math.round(p*100)+'%'; }
function notePlaceholder(c, val){
  if(val===0) return `What was missed or done incorrectly for ${c.name.toLowerCase()}?`;
  if(val===1) return `What was partially done, and what's still missing?`;
  if(val===c.max) return `What did support do well here?`;
  return `Score this criterion first, then explain why.`;
}
function buildSummary(scores, notes){
  const notMet=[], partial=[], met=[];
  CRITERIA.forEach(c=>{
    const val = scores[c.key];
    const note = (notes[c.key]||'').trim();
    const entry = { name:c.name, note, val };
    if(val===0) notMet.push(entry);
    else if(val===c.max) met.push(entry);
    else partial.push(entry);
  });
  const gaps = [...notMet, ...partial];
  const lower = s=>s.charAt(0).toLowerCase()+s.slice(1);
  const list = arr => arr.length<=1 ? (arr[0]||'') : arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1];

  // -------- SUPPORT ACTION: one plain-language recap paragraph --------
  let supportAction;
  if(!met.length && !gaps.length){
    supportAction = 'Score each criterion above, then generate the summary.';
  } else {
    const parts = [];
    if(met.length){
      parts.push(`Support handled ${list(met.map(m=>lower(m.name)))} well on this case.`);
      met.filter(m=>m.note).forEach(m=>parts.push(m.note));
    }
    if(gaps.length){
      parts.push(`${met.length ? 'That said, there' : 'There'} ${gaps.length>1?'were':'was'} some gaps around ${list(gaps.map(g=>lower(g.name)))}.`);
      gaps.forEach(g=>{ if(g.note) parts.push(g.note); });
    }
    supportAction = parts.join(' ');
  }

  // -------- COMMITMENT / OBSERVATIONS: a short first-person read of the case --------
  let commitment;
  if(!gaps.length){
    commitment = `I didn't see anything that needs to change here. Support covered every part of the process well, so the plan is just to keep this up on similar cases.`;
  } else {
    let text = `I noticed ${list(gaps.map(g=>lower(g.name)))} could use some attention. `;
    const notedGaps = gaps.filter(g=>g.note).map(g=>g.note);
    if(notedGaps.length) text += notedGaps.join(' ') + ' ';
    text += `Going forward, I'd like to see this handled consistently so it doesn't come up again on similar cases.`;
    if(met.length) text += ` The way support handled ${list(met.map(m=>lower(m.name)))} was solid, so that's worth keeping too.`;
    commitment = text;
  }

  // -------- ADDITIONAL ACTIONS: short, concrete list --------
  let additional;
  if(!gaps.length){
    additional = 'Nothing extra needed here. Everything in this case was handled the right way.';
  } else {
    additional = gaps.map(g=>{
      const base = g.note ? g.note : `Take a closer look at ${lower(g.name)} on the next similar case.`;
      return `${g.name}: ${base}`;
    }).join('\n\n');
  }

  // -------- TL COMMITMENT: a short coaching plan, written like a person would say it --------
  let tlNotes;
  if(!gaps.length){
    tlNotes = `Nothing to coach on this time. I'll keep recognizing the consistent work support put into this case.`;
  } else {
    let text = `I'll sit down with support and walk through ${list(gaps.map(g=>lower(g.name)))}, using this case as the example. `;
    text += `We'll go over what the process should look like, and I'll keep an eye on the next few cases to see if it sticks.`;
    if(met.length) text += ` I'll also call out what went well in ${list(met.map(m=>lower(m.name)))}, since that's worth reinforcing.`;
    tlNotes = text;
  }

  return { supportAction: supportAction.trim(), commitment: commitment.trim(), additional: additional.trim(), tlNotes: tlNotes.trim() };
}

/* ---------------------- TOASTS ---------------------- */
function toast(msg, isError){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.borderLeftColor = 'var(--red)';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function toastRetry(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.borderLeftColor = 'var(--red)';
  el.style.cursor = 'pointer';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  el.addEventListener('click', ()=>{ el.remove(); saveState(); });
  wrap.appendChild(el);
  setTimeout(()=>{ if(el.isConnected){ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); } }, 6000);
}

/* ---------------------- NAV / ROUTING ---------------------- */
const PAGE_META = {
  dashboard: ['Dashboard', 'Automatic scoring and monthly averages across the team'],
  counts: ['Review Count & Target', 'Track how many evaluations were completed against the monthly goal'],
  new: ['New Feedback', 'Score a SEQAS evaluation and capture coaching notes'],
  records: ['Records', 'Every evaluation on file, filterable by month and support'],
  supports: ['Manage Supports', 'Add or remove people from the active roster'],
};

function setView(view, opts={}){
  currentView = view;
  if(!opts.keepEditing) editingRecordId = null;
  document.querySelectorAll('.navlist button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  const meta = PAGE_META[view];
  document.getElementById('pageTitle').textContent = meta[0];
  document.getElementById('pageSub').textContent = meta[1];
  render();
}

function populateGlobalMonth(){
  const sel = document.getElementById('globalMonth');
  const months = allMonthsUsed();
  sel.innerHTML = months.map(m=>`<option value="${m}" ${m===currentMonth?'selected':''}>${monthLabel(m)}</option>`).join('');
  document.getElementById('sidebarMonthChip').textContent = monthLabel(currentMonth);
}

/* ---------------------- RENDER ROOT ---------------------- */
function render(){
  populateGlobalMonth();
  const c = document.getElementById('content');
  if(currentView==='dashboard') c.innerHTML = renderDashboard();
  else if(currentView==='counts') c.innerHTML = renderCounts();
  else if(currentView==='new') c.innerHTML = renderNewFeedback();
  else if(currentView==='records') c.innerHTML = renderRecords();
  else if(currentView==='supports') c.innerHTML = renderSupports();
  attachViewHandlers();
}

/* ======================================================================
   DASHBOARD
   ====================================================================== */
function renderDashboard(){
  const months = allMonthsUsed();
  const thisMonthRecs = recordsFor(currentMonth);
  const teamAvg = avgPercent(thisMonthRecs);
  const target = getTarget(currentMonth);
  const rate = target>0 ? thisMonthRecs.length/target : null;

  const rows = sortedSupports().map(sup=>{
    const cells = months.map(m=>{
      const recs = recordsFor(m, sup.id);
      const avg = avgPercent(recs);
      if(!recs.length) return `<td class="num" style="color:var(--slate-soft);">—</td>`;
      return `<td class="num"><span class="badge ${scoreBadgeClass(avg)}">${pctStr(avg)}</span> <span style="color:var(--slate-soft); font-size:11px;">(${recs.length})</span></td>`;
    }).join('');
    const supAll = recordsFor(null, sup.id).length ? STATE.records.filter(r=>r.supportId===sup.id) : [];
    const overallAvg = avgPercent(supAll);
    return `<tr><td style="font-weight:600;">${esc(sup.name)}</td>${cells}<td class="num"><span class="badge ${scoreBadgeClass(overallAvg)}">${pctStr(overallAvg)}</span></td></tr>`;
  }).join('');

  const teamOverallAvg = avgPercent(STATE.records);

  return `
  <div class="stat-row">
    <div class="stat-card">
      <div class="label">Active Supports</div>
      <div class="value">${STATE.supports.length}</div>
      <div class="delta">on the current roster</div>
    </div>
    <div class="stat-card">
      <div class="label">${monthLabel(currentMonth)} Average Score</div>
      <div class="value">${pctStr(teamAvg)} <small>/ 100%</small></div>
      <div class="delta">across ${thisMonthRecs.length} evaluation${thisMonthRecs.length===1?'':'s'}</div>
    </div>
    <div class="stat-card">
      <div class="label">${monthLabel(currentMonth)} Reviews vs Target</div>
      <div class="value">${thisMonthRecs.length}<small> / ${target}</small></div>
      <div class="delta"><span class="badge ${rate>=1?'green':'red'}">${rate===null?'—':Math.round(rate*100)+'%'} of target</span></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>Score Summary</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">Average % per support, per month &middot; overall average ${pctStr(teamOverallAvg)}</span>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table>
        <thead><tr><th>Support</th>${months.map(m=>`<th>${monthLabel(m).slice(0,3).toUpperCase()} '${m.slice(2,4)}</th>`).join('')}<th>Overall</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab to begin scoring.', 'supports','Add supports')}
    </div>
  </div>
  `;
}

/* ======================================================================
   REVIEW COUNT & TARGET
   ====================================================================== */
function renderCounts(){
  const months = allMonthsUsed();
  const rows = sortedSupports().map(sup=>{
    const cells = months.map(m=> `<td class="num">${recordsFor(m, sup.id).length || '<span style="color:var(--slate-soft);">0</span>'}</td>`).join('');
    return `<tr><td style="font-weight:600;">${esc(sup.name)}</td>${cells}</tr>`;
  }).join('');

  const totalCells = months.map(m=> `<td class="num">${recordsFor(m).length}</td>`).join('');
  const targetCells = months.map(m=> `<td class="num"><input type="number" min="0" class="target-input" data-target-month="${m}" value="${getTarget(m)}"></td>`).join('');
  const rateCells = months.map(m=>{
    const total = recordsFor(m).length;
    const target = getTarget(m);
    const rate = target>0 ? total/target : null;
    return `<td class="num"><span class="badge ${rate===null?'neutral':(rate>=1?'green':'red')}">${rate===null?'—':Math.round(rate*100)+'%'}</span></td>`;
  }).join('');

  return `
  <div class="card">
    <div class="card-header">
      <h3>Review Count by Support</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">Number of evaluations logged per month</span>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table class="count-table">
        <thead><tr><th>Support</th>${months.map(m=>`<th>${monthLabel(m).slice(0,3).toUpperCase()} '${m.slice(2,4)}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
        <tbody>
          <tr class="row-total"><td>Total</td>${totalCells}</tr>
          <tr><td style="font-weight:600;">Target <span style="font-weight:400; color:var(--slate-soft); font-size:11px;">(editable)</span></td>${targetCells}</tr>
          <tr><td style="font-weight:600;">Rate</td>${rateCells}</tr>
        </tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab to begin tracking.', 'supports','Add supports')}

  </div>
  <p class="field-hint" style="margin-top:14px;">The monthly target is a team-wide goal (e.g. 8 or 16 total evaluations). Change any number above and it saves automatically.</p>
  `;
}

/* ======================================================================

    return emptyState('Add a support first', 'You need at least one support on the roster before logging an evaluation.', 'supports', 'Go to Manage Supports');
  }

  const notes = editing ? (editing.criteriaNotes || {}) : {};
  const scoreRows = CRITERIA.map(c=>{
    const val = scores[c.key];
    const options = c.max===1 ? [0,1] : [0,1,2];
    const optLabels = c.max===1 ? ['Not Met','Met'] : ['Not Met','Partial','Met'];
    const segButtons = options.map((o,i)=>`<button type="button" class="sel-${o} ${val===o?'active':''}" data-score-key="${c.key}" data-score-val="${o}">${optLabels[i]}</button>`).join('');
    const band = val===undefined ? 'unscored' : String(val);

      <div class="crit-note">

        <textarea data-note-key="${c.key}" placeholder="${notePlaceholder(c, val)}">${esc(noteVal)}</textarea>

            <input type="month" id="f_month" value="${editing?editing.month:currentMonth}" required>
          </div>
          <div class="field">
            <label class="field-label">Date of Evaluation</label>
            <input type="date" id="f_evalDate" value="${editing?editing.dateOfEval:''}" required>
          </div>
          <div class="field">
            <label class="field-label">Chat Date</label>
            <input type="date" id="f_chatDate" value="${editing?editing.chatDate:''}" required>
          </div>
          <div class="field">

            <input type="text" id="f_agent" placeholder="e.g. Maria Fernandez" value="${editing?esc(editing.agentName):''}" required>
          </div>
          <div class="field">
            <label class="field-label">Case Number</label>
            <input type="text" id="f_case" placeholder="e.g. 13587296" value="${editing?esc(editing.caseNumber):''}" required>
          </div>
        </div>

    </div>

    <div id="previousReviewsPanel"></div>

    <div class="card" style="margin-top:20px;">

      <div class="card-body" id="scoreArea">${scoreRows}</div>

          <div><div class="tlabel">Review Score</div><div class="tval" id="livePercent">${editing?pctStr(editing.percent):'0%'}</div></div>

/* ======================================================================
   EVENT HANDLERS PER VIEW
   ====================================================================== */
function attachViewHandlers(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click', ()=>setView(b.dataset.goto)));

  if(currentView==='counts'){
    document.querySelectorAll('[data-target-month]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const m = inp.dataset.targetMonth;
        const v = Math.max(0, parseInt(inp.value)||0);
        STATE.targets[m] = v;
        await saveState();
        render();
        toast('Target updated');
      });
    });
  }

  if(currentView==='new'){
    const existing = editingRecordId ? STATE.records.find(r=>r.id===editingRecordId) : null;
    let liveScores = existing ? {...existing.scores} : {};
    let liveNotes = existing ? {...(existing.criteriaNotes||{})} : {};

    function renderPrevReviews(){
      const panel = document.getElementById('previousReviewsPanel');
      if(!panel) return;
      const supId = document.getElementById('f_support').value;
      const month = document.getElementById('f_month').value;
      const prior = STATE.records
        .filter(r=>r.supportId===supId && r.month===month && r.id!==editingRecordId)
        .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      if(!prior.length){ panel.innerHTML=''; return; }
      panel.innerHTML = `
        <div class="prev-reviews">
          <div class="prev-title">Already on file for ${monthLabel(month)}</div>
          ${prior.map(p=>`
            <div class="prev-item">
              <span>${fmtDate(p.dateOfEval)} &middot; agent <span class="agent-name">${esc(p.agentName)}</span> &middot; case ${esc(p.caseNumber)}</span>
              <span class="badge ${scoreBadgeClass(p.percent)}">${p.total}/${MAX_SCORE} &middot; ${pctStr(p.percent)}</span>
            </div>`).join('')}
        </div>`;
    }
    renderPrevReviews();
    document.getElementById('f_support').addEventListener('change', renderPrevReviews);
    document.getElementById('f_month').addEventListener('change', renderPrevReviews);

    document.querySelectorAll('[data-score-key]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = btn.dataset.scoreKey, val = parseInt(btn.dataset.scoreVal);
        liveScores[key] = val;
        document.querySelectorAll(`[data-score-key="${key}"]`).forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const card = document.querySelector(`.crit-card[data-crit-key="${key}"]`);
        if(card){
          card.dataset.band = String(val);
          const c = CRITERIA.find(cc=>cc.key===key);
          const ta = card.querySelector('textarea[data-note-key]');
          if(ta) ta.placeholder = notePlaceholder(c, val);
        }
        const total = Object.values(liveScores).reduce((s,v)=>s+v,0);
        document.getElementById('liveTotal').innerHTML = `${total} <small>/ ${MAX_SCORE}</small>`;
        document.getElementById('livePercent').textContent = Math.round((total/MAX_SCORE)*100)+'%';
      });
    });

    document.querySelectorAll('textarea[data-note-key]').forEach(ta=>{
      ta.addEventListener('input', ()=>{ liveNotes[ta.dataset.noteKey] = ta.value; });
    });

    document.querySelectorAll('[data-crit-toggle]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = btn.dataset.critToggle;
        const panel = document.getElementById('critInfo-'+key);
        const isOpen = panel.classList.toggle('open');
        btn.textContent = isOpen ? 'Hide full criteria \u25B4' : 'View full criteria \u25BE';
      });
    });

    const genBtn = document.getElementById('generateSummaryBtn');
    if(genBtn){
      genBtn.addEventListener('click', ()=>{
        if(Object.keys(liveScores).length < CRITERIA.length){
          toast('Score every criterion first \u2014 the summary is built from those ratings.', true);
          return;
        }
        const summary = buildSummary(liveScores, liveNotes);
        document.getElementById('f_supportAction').value = summary.supportAction;
        document.getElementById('f_commitment').value = summary.commitment;
        document.getElementById('f_additional').value = summary.additional;
        document.getElementById('f_tlNotes').value = summary.tlNotes;
        toast('Summary generated \u2014 feel free to fine-tune the wording.');
      });
    }

    document.getElementById('feedbackForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(Object.keys(liveScores).length < CRITERIA.length){
        toast('Please score every criterion before saving.', true);
        return;
      }
      const total = Object.values(liveScores).reduce((s,v)=>s+v,0);
      const percent = total/MAX_SCORE;
      const supportId = document.getElementById('f_support').value;
      const support = STATE.supports.find(s=>s.id===supportId);
      const record = {
        id: editingRecordId || uid('rec'),
        month: document.getElementById('f_month').value || currentMonth,
        supportId, supportName: support?support.name:'',
        dateOfEval: document.getElementById('f_evalDate').value,
        chatDate: document.getElementById('f_chatDate').value,
        agentName: document.getElementById('f_agent').value,
        caseNumber: document.getElementById('f_case').value,
        scores: liveScores, criteriaNotes: liveNotes, total, percent,
        supportAction: document.getElementById('f_supportAction').value,
        commitmentObservations: document.getElementById('f_commitment').value,
        additionalActions: document.getElementById('f_additional').value,
        tlCommitment: document.getElementById('f_tlNotes').value,
        createdAt: editingRecordId ? (existing?.createdAt || Date.now()) : Date.now(),
        updatedAt: Date.now()
      };
      if(editingRecordId){
        const idx = STATE.records.findIndex(r=>r.id===editingRecordId);
        STATE.records[idx] = record;
      } else {
        STATE.records.push(record);
      }
      currentMonth = record.month;
      await saveState();
      toast(editingRecordId ? 'Evaluation updated' : 'Evaluation saved');
      editingRecordId = null;
      setView('records');
    });
    const cancelBtn = document.getElementById('cancelEdit');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingRecordId=null; setView('records'); });
  }

  if(currentView==='records'){
    renderRecordsTable();
    document.getElementById('filterMonth').addEventListener('change', renderRecordsTable);
    document.getElementById('filterSupport').addEventListener('change', renderRecordsTable);
  }

  if(currentView==='supports'){
    document.getElementById('addSupportForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const inp = document.getElementById('newSupportName');
      const name = inp.value.trim();
      if(!name) return;
      STATE.supports.push({ id: uid('sup'), name });
      await saveState();
      inp.value='';
      render();
      toast('Support added');
    });
    document.querySelectorAll('[data-remove-support]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.removeSupport;
        const sup = STATE.supports.find(s=>s.id===id);
        if(!confirm(`Remove ${sup.name} from the active roster? Their past evaluations will stay on record.`)) return;
        STATE.supports = STATE.supports.filter(s=>s.id!==id);
        await saveState();
        render();
        toast('Support removed');
      });
    });
  }
}

async function confirmDeleteRecord(id){
  const rec = STATE.records.find(r=>r.id===id);
  if(!rec) return;
  if(!confirm(`Delete the ${monthLabel(rec.month)} evaluation for ${rec.supportName}? This can't be undone.`)) return;
  STATE.records = STATE.records.filter(r=>r.id!==id);
  if(rec.caseNumber){
    STATE.deletedCaseNumbers = STATE.deletedCaseNumbers || [];
    if(!STATE.deletedCaseNumbers.includes(String(rec.caseNumber))){
      STATE.deletedCaseNumbers.push(String(rec.caseNumber));
    }
  }
  renderRecordsTable();
  const ok = await saveState();
  if(ok){
    toast('Evaluation deleted for good \u2014 it won\u2019t come back on refresh.');
  } else {
    toastRetry('Deleted here, but the save failed \u2014 tap to retry so it stays deleted.');
  }
}

/* ======================================================================
   EXPORT MODAL (email preview + PDF)
   ====================================================================== */
function openExportModal(recordId){
  const r = STATE.records.find(x=>x.id===recordId);
  if(!r) return;
  const subject = `SEQAS REVIEW - ${r.supportName} | ${monthShort(r.month)}`;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-backdrop" id="exportBackdrop">
    <div class="modal">
      <div class="modal-head">
        <h3>Export Evaluation</h3>
        <button class="icon-btn" id="closeExportModal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label">Email Subject</label>
          <input type="text" id="subjectField" value="${esc(subject)}" readonly>
        </div>
        <div class="letterhead" style="margin-top:6px;">
          <div class="lh-band"><h4>SEQAS REVIEW \u2014 ${esc(r.supportName)}</h4><span style="font-size:12px; color:#a9d3c9;">${monthShort(r.month)}</span></div>
          <div class="lh-body">
            <table class="kv-table">
              <tr><td class="k">Date of Evaluation</td><td>${fmtDate(r.dateOfEval)}</td></tr>
              <tr><td class="k">Chat Date</td><td>${fmtDate(r.chatDate)}</td></tr>
              <tr><td class="k">Support Name</td><td>${esc(r.supportName)}</td></tr>
              <tr><td class="k">Agent Name</td><td class="agent-name">${esc(r.agentName)}</td></tr>
              <tr><td class="k">Case Number</td><td>${esc(r.caseNumber)}</td></tr>
              <tr><td class="k">Review Score</td><td>${r.total}/${MAX_SCORE} (${pctStr(r.percent)})</td></tr>
            </table>
            <div class="section-block"><h5>Support Action</h5><p>${esc(r.supportAction)||'\u2014'}</p></div>
            <div class="section-block"><h5>Commitment Met / Observations</h5><p>${esc(r.commitmentObservations)||'\u2014'}</p></div>
            <div class="section-block"><h5>Additional Actions That Could Be Performed</h5><p>${esc(r.additionalActions)||'\u2014'}</p></div>
            <div class="section-block"><h5>TL Commitment and Coaching Notes</h5><p>${esc(r.tlCommitment)||'\u2014'}</p></div>
          </div>
        </div>
        <p class="field-hint">Downloading the PDF saves it to your device automatically. Attach it to the email before sending \u2014 mailto links can't attach files for you.</p>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="copyEmailBtn">Copy Email Text</button>
        <button class="btn ghost" id="openMailBtn">Open in Email</button>
        <button class="btn brass" id="downloadPdfBtn">Download PDF</button>
      </div>
    </div>
  </div>`;

  document.getElementById('closeExportModal').addEventListener('click', ()=>root.innerHTML='');
  document.getElementById('exportBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='exportBackdrop') root.innerHTML=''; });

  const emailBody = buildEmailBody(r);
  document.getElementById('copyEmailBtn').addEventListener('click', ()=>{
    navigator.clipboard.writeText(emailBody).then(()=>toast('Email text copied')).catch(()=>toast('Could not copy \u2014 select and copy manually.', true));
  });
  document.getElementById('openMailBtn').addEventListener('click', ()=>{
    const mailto = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody)}`;
    window.location.href = mailto;
  });
  document.getElementById('downloadPdfBtn').addEventListener('click', ()=>generatePdf(r, subject));
}

function buildEmailBody(r){
  return `Hi ${r.supportName},

Please review the attached SEQAS evaluation. It outlines feedback, along with the opportunities identified for this case. After reviewing it, please reply with your action plan on how you'll address these opportunities moving forward.

DATE OF EVALUATION : ${fmtDate(r.dateOfEval)}
CHAT DATE : ${fmtDate(r.chatDate)}
SUPPORT NAME : ${r.supportName}
AGENT NAME : ${r.agentName}
CASE NUMBER : ${r.caseNumber}

(PDF evaluation attached)`;
}

function generatePdf(r, subject){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const marginX = 48;
    let y = 56;
    const pageWidth = doc.internal.pageSize.getWidth();

    // Letterhead band
    doc.setFillColor(54,116,181);
    doc.rect(0,0,pageWidth,64,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(17);
    doc.text('SEQAS REVIEW', marginX, 34);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.text(`${r.supportName}  |  ${subject.split('|')[1].trim()}`, marginX, 50);

    y = 96;
    doc.setTextColor(28,43,58);

    // Key/value table
    const kv = [
      ['DATE OF EVALUATION', fmtDate(r.dateOfEval), false],
      ['CHAT DATE', fmtDate(r.chatDate), false],
      ['SUPPORT NAME', r.supportName, false],
      ['AGENT NAME', r.agentName, true],
      ['CASE NUMBER', String(r.caseNumber), false],
      ['REVIEW SCORE', `${r.total}/${MAX_SCORE}  (${Math.round(r.percent*100)}%)`, false],
    ];
    const rowH = 22;
    kv.forEach((pair, i)=>{
      const ry = y + i*rowH;
      doc.setFillColor(i%2===0 ? 234 : 247, i%2===0 ? 244 : 250, i%2===0 ? 251 : 253);
      doc.rect(marginX, ry-14, pageWidth-marginX*2, rowH, 'F');
      doc.setDrawColor(214,229,240);
      doc.rect(marginX, ry-14, pageWidth-marginX*2, rowH, 'S');
      doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.setTextColor(92,98,112);
      doc.text(pair[0], marginX+10, ry);
      doc.setFont('helvetica', pair[2] ? 'italic' : 'normal'); doc.setFontSize(11);
      doc.setTextColor(28,43,58);
      doc.text(String(pair[1]), marginX+190, ry);
    });
    y = y + kv.length*rowH + 24;

    const sections = [
      ['Support Action', r.supportAction],
      ['Commitment Met / Observations', r.commitmentObservations],
      ['Additional Actions That Could Be Performed', r.additionalActions],
      ['TL Commitment and Coaching Notes', r.tlCommitment],
    ];
    sections.forEach(([title, body])=>{
      if(y > 740){ doc.addPage(); y = 56; }
      doc.setDrawColor(54,116,181);
      doc.setLineWidth(1.4);
      doc.line(marginX, y, marginX+34, y);
      doc.setFont('helvetica','bold'); doc.setFontSize(12.5);
      doc.setTextColor(28,43,58);
      doc.text(title, marginX, y-6);
      y += 16;
      doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
      doc.setTextColor(28,43,58);
      const lines = doc.splitTextToSize(body && body.trim() ? body : '\u2014', pageWidth - marginX*2);
      lines.forEach(line=>{
        if(y > 780){ doc.addPage(); y = 56; }
        doc.text(line, marginX, y);
        y += 14;
      });
      y += 16;
    });

    const fname = `SEQAS_${r.supportName.replace(/\s+/g,'_')}_${r.month}.pdf`;
    doc.save(fname);
    toast('PDF downloaded');
  }catch(e){
    console.error(e);
    toast('Could not generate the PDF in this browser.', true);
  }
}

/* ======================================================================
   INIT
   ====================================================================== */
async function init(){
  await loadState();
  await ensureAugustSeed();
  await ensureAugustNotes();
  document.getElementById('globalMonth').addEventListener('change', (e)=>{ currentMonth = e.target.value; render(); });
  document.querySelectorAll('.navlist button').forEach(b=>b.addEventListener('click', ()=>setView(b.dataset.view)));
  document.getElementById('saveStatus').addEventListener('click', ()=>{
    if(document.getElementById('saveStatus').classList.contains('error')) saveState();
  });
  if(STATE.records.some(r=>r.month==='2026-08')) currentMonth = '2026-08';
  setView('dashboard');
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
}
init();
</script>

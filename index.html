<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --pal-navy:#093C5D; --pal-blue:#3B7597; --pal-teal:#6FD1D7; --pal-mint:#5DF8D8;
    --ink:#093C5D; --ink-2:#3B7597; --ink-soft:#2c5470; --paper:#d9eef0; --paper-deep:#c4e3e6;
    --card:#f7fdfd; --rule:#b3d8db; --rule-soft:#cbe6e8; --brass:#3B7597; --brass-dark:#26506b;
    --brass-tint:#d7f2f0; --ink-text:#093C5D; --slate:#365f6e; --slate-soft:#6c959e;
    --green:#0d6b5c; --green-bg:#8ff0dd; --red:#8f2f2f; --red-bg:#f6c9c9;
    --amber:#7a5e10; --amber-bg:#f5dd8f; --neutral-ink:#2c5f68; --neutral-bg:#cdeceb;
    --radius:10px; --radius-sm:6px; --shadow: 0 1px 2px rgba(9,60,93,0.06), 0 4px 16px rgba(9,60,93,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink-text); font-family:'Inter', -apple-system, sans-serif; font-size:14.5px; line-height:1.5; min-height:100vh; }
  ::selection{ background: var(--brass); color:#fff; }
  .app{ display:flex; min-height:100vh; }
  .sidebar{ width:242px; flex-shrink:0; background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%); border-right:1px solid rgba(255,255,255,0.06); color:#dcefe9; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .brand{ padding:26px 22px 18px 22px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .brand .mark{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .brand .seal{ width:30px;height:30px;border-radius:50%; background:rgba(93,248,216,0.14); border:1px solid var(--pal-mint); display:flex;align-items:center;justify-content:center; font-weight:700; font-size:12.5px; color:var(--pal-mint); flex-shrink:0; }
  .brand h1{ font-weight:800; font-size:18px; letter-spacing:-0.01em; margin:0; color:#f2fbf8; }
  .brand .tagline{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:#7fa39b; margin-top:3px; }
  .viewer-picker{ margin-top:14px; }
  .viewer-picker label{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:#7fa39b; display:block; margin-bottom:5px; font-weight:700; }
  .viewer-picker select{ width:100%; background:#ffffff; border:1px solid rgba(255,255,255,0.5); color:var(--pal-navy); font-size:13px; font-weight:600; padding:9px 30px 9px 11px; border-radius:var(--radius-sm); cursor:pointer; appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23093C5D' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat:no-repeat; background-position:right 9px center; }
  nav.navlist{ padding:16px 12px; flex:1; overflow-y:auto; }
  .navlist button{ width:100%; display:flex; align-items:center; gap:11px; background:none; border:none; color:#a9c9c2; text-align:left; font-family:inherit; font-size:13.5px; font-weight:500; padding:9px 12px; border-radius:var(--radius-sm); cursor:pointer; margin-bottom:2px; transition:background 0.15s, color 0.15s; }
  .navlist button svg{ flex-shrink:0; opacity:0.75; }
  .navlist button:hover{ background:rgba(255,255,255,0.06); color:#f2fbf8; }
  .navlist button.active{ background:rgba(93,248,216,0.16); color:var(--pal-mint); font-weight:600; box-shadow:inset 2px 0 0 var(--pal-mint); }
  .navlist button.active svg{ opacity:1; }
  .navlist .navgroup-label{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#5f7d77; padding:14px 12px 6px 12px; font-weight:600; }
  .sidebar-foot{ padding:14px 22px 18px 22px; border-top:1px solid rgba(255,255,255,0.1); font-size:11.5px; color:#7fa39b; display:flex; flex-direction:column; gap:10px; }
  .sidebar-foot .month-chip{ display:inline-flex;align-items:center;gap:6px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); padding:5px 10px;border-radius:20px; color:#f2fbf8; font-weight:600; font-size:12px; width:fit-content; }
  .save-status{ display:flex; align-items:center; gap:7px; font-size:11px; color:#7fa39b; }

  .main{ flex:1; min-width:0; }
  .topbar{ position:sticky; top:0; z-index:5; background:rgba(220,238,234,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--rule); padding:20px 36px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .topbar h2{ font-size:24px; font-weight:700; margin:0; color:var(--ink); }
  .topbar .sub{ color:var(--slate); font-size:12.5px; margin-top:2px; }
  .content{ padding:28px 36px 60px 36px; max-width:1180px; }

  .month-select label{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--slate-soft); }
  .month-select select{ border:none; background:none; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--ink); padding:4px 6px; cursor:pointer; }
  .card{ background:var(--card); border:1px solid var(--rule-soft); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-header{ padding:16px 20px; border-bottom:1px solid var(--rule-soft); display:flex; align-items:center; justify-content:space-between; gap:12px; }

  .section-divider{ display:flex; align-items:center; gap:12px; margin:8px 0 16px 0; }

  .stat-card{ background:var(--card); border:1px solid var(--rule-soft); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .stat-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--brass); }
  .stat-card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--slate-soft); font-weight:600; }

  .stat-card .delta{ font-size:12px; margin-top:4px; color:var(--slate); }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate-soft); font-weight:700; padding:9px 12px; border-bottom:2px solid var(--rule); white-space:nowrap; }
  td{ padding:11px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(169,121,58,0.045); }
  .num{ font-family:'IBM Plex Mono',monospace; }
  .agent-name{ font-style:italic; font-weight:500; color:var(--slate); }
  .badge{ display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px; padding:3px 9px; border-radius:20px; }
  .badge.green{ background:var(--green-bg); color:var(--green); }
  .badge.amber{ background:var(--amber-bg); color:var(--amber-dark, var(--amber)); }
  .badge.red{ background:var(--red-bg); color:var(--red); }
  .badge.neutral{ background:var(--paper-deep); color:var(--slate); }
  .type-badge{ display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:var(--brass-tint); color:var(--brass-dark); white-space:nowrap; }
  .type-badge.commendation{ background:var(--green-bg); color:var(--green); }
  .mode-toggle{ display:flex; align-items:center; gap:2px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:3px; width:fit-content; }
  .mode-toggle button{ display:flex; align-items:center; gap:5px; border:none; background:none; cursor:pointer; font-family:inherit; font-size:11px; font-weight:600; color:#8aa9a3; padding:6px 11px; border-radius:16px; transition:background 0.15s, color 0.15s; }
  .mode-toggle button.active{ background:var(--pal-mint); color:var(--pal-navy); }
  button.btn{ font-family:inherit; font-weight:600; font-size:13px; border-radius:var(--radius-sm); cursor:pointer; padding:9px 16px; border:1px solid transparent; transition:all 0.12s; }
  button.btn.brass{ background:var(--brass); color:#fff; }
  button.btn.brass:hover{ background:var(--brass-dark); }
  button.btn.ghost{ background:transparent; border:1px solid var(--rule); color:var(--ink-text); }
  button.btn.ghost:hover{ border-color:var(--slate-soft); }
  button.btn.danger{ background:transparent; color:var(--red); border:1px solid var(--red-bg); }
  button.btn.danger:hover{ background:var(--red-bg); }
  button.btn.sm{ padding:5px 11px; font-size:12px; }
  .icon-btn{ background:none; border:none; cursor:pointer; color:var(--slate); padding:6px; border-radius:var(--radius-sm); display:inline-flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ background:var(--paper-deep); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--red-bg); color:var(--red); }
  label.field-label{ display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate); margin-bottom:6px; }
  input[type=text], input[type=number], input[type=date], select, textarea{ width:100%; font-family:inherit; font-size:13.5px; color:var(--ink-text); background:var(--card); border:1px solid var(--rule); border-radius:var(--radius-sm); padding:9px 11px; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  textarea{ resize:vertical; min-height:76px; line-height:1.5; }
  .field{ margin-bottom:16px; }
  .field-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .field-hint{ font-size:11.5px; color:var(--slate-soft); margin-top:5px; }
  .empty-state{ text-align:center; padding:56px 20px; color:var(--slate-soft); }
  .empty-state svg{ opacity:0.5; margin-bottom:12px; }
  .empty-state h4{ font-size:17px; margin:0 0 6px 0; color:var(--ink); }
  .empty-state p{ font-size:13px; margin:0 0 18px 0; }
  .toast-wrap{ position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px; }
  .toast{ background:var(--ink); color:#eafaf5; padding:12px 18px; border-radius:10px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,0.25); display:flex; align-items:center; gap:10px; border-left:3px solid var(--brass); }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,29,49,0.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; z-index:100; overflow-y:auto; }
  .modal{ background:var(--paper); border-radius:5px; width:100%; max-width:680px; box-shadow:0 20px 60px rgba(0,0,0,0.35); border:1px solid var(--rule); }
  .modal-head{ padding:18px 24px; border-bottom:1px solid var(--rule); display:flex; align-items:center; justify-content:space-between; }
  .modal-head h3{ margin:0; font-size:18px; }
  .modal-body{ padding:22px 24px; max-height:70vh; overflow-y:auto; }
  .modal-foot{ padding:16px 24px; border-top:1px solid var(--rule); display:flex; justify-content:flex-end; gap:10px; }
  .letterhead{ border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; background:var(--card); }
  .letterhead .lh-band{ background:var(--ink); color:#eafaf5; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; }
  .letterhead .lh-band h4{ margin:0; font-size:16px; font-weight:700; }
  .letterhead .lh-body{ padding:20px 22px; }
  .kv-table{ width:100%; border-collapse:collapse; }
  .kv-table td{ padding:8px 12px; border:1px solid var(--rule); font-size:13px; }
  .kv-table td.k{ background:var(--paper-deep); font-weight:700; width:210px; text-transform:uppercase; font-size:11px; letter-spacing:0.04em; color:var(--slate); }
  .section-block{ margin-top:18px; }
  .section-block h5{ font-size:14px; margin:0 0 6px 0; color:var(--ink); font-weight:700; border-bottom:1.5px solid var(--brass); padding-bottom:5px; display:inline-block; }
  .section-block p{ margin:8px 0 0 0; color:var(--ink-text); white-space:pre-wrap; }
  .attendance-compact input[type=number]{ padding:7px 8px; text-align:center; }
  .attendance-compact .field-label{ font-size:10px; margin-bottom:4px; }
  .loading-screen{ position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:999; }
  .loading-screen .seal-lg{ width:52px;height:52px;border-radius:50%; border:2px solid var(--brass); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; color:var(--brass); }
</style>
</head>
<body>

<div id="loading" class="loading-screen">
  <div class="seal-lg">SP</div>
  <p>Loading your saved reviews…</p>
</div>

<div class="app" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <div class="seal">SP</div>
        <h1>Support Portal</h1>
      </div>
      <div class="tagline">Evaluation &amp; Coaching Ledger</div>
      <div id="viewerPickerWrap"></div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div class="sidebar-foot">
      <div class="save-status" id="saveStatus"><span class="dot"></span><span id="saveStatusText">All changes saved</span></div>
      <div class="month-chip" id="sidebarMonthChip">—</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Support Performance</h2>
        <div class="sub" id="pageSub">Your SEQAS scores and Agent Review progress in one place</div>
      </div>
      <div class="month-select">
        <label>Month</label>
        <select id="globalMonth"></select>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>

<script>
const MAX_SCORE = 17;
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

let STATE = {
  supports: [], targets: {}, records: [], seededAugust2026: false, deletedCaseNumbers: [],
  augustAccuracyApplied: false, agentReviews: [], viewerSupportId: null, personalTargets: {},
  attendance: {}, agentReviewDeletionCounts: {}, agentReviewAugust2026Seeded: false,
  historicalDuplicatesCleaned: false, deletedAgentReviewIds: []
};

let currentView = 'myDashboard';
let currentMonth = monthKey(new Date());
let editingAgentReviewId = null;
let agentReviewKind = 'review';

const AGENT_REVIEW_TYPES = ['Procedural','Knowledge Gap','Behaviour','Troubleshooting','Call Handling','Technical'];
const AGENT_COMMENDATION_CATEGORIES = ['Exceptional Customer Service','Technical Excellence','Process & Policy Adherence','Efficiency & Productivity','Team Collaboration','Going Above & Beyond'];
const SEVERITY_LEVELS = ['Low','Medium','High','Critical'];
const IMPACT_LEVELS = ['Low','Medium','High','Significant'];

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(mk){ const [y,m]=mk.split('-').map(Number); return MONTH_NAMES[m-1]+' '+y; }
function monthShort(mk){ const [y,m]=mk.split('-').map(Number); return MONTH_ABBR[m-1]+' '+y; }
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}); }

const STORAGE_KEY = 'seqas-review-app-data';
const SYNC_URL_KEY = 'seqas-sync-url';
const DEFAULT_SYNC_URL = 'https://support-performance-ec0a1-default-rtdb.firebaseio.com';
let SYNC_URL = DEFAULT_SYNC_URL;
try{
  const stored = localStorage.getItem(SYNC_URL_KEY);
  SYNC_URL = (stored === null) ? DEFAULT_SYNC_URL : stored;
}catch(e){ SYNC_URL = DEFAULT_SYNC_URL; }

function setSaveStatus(state, text){
  const wrap = document.getElementById('saveStatus');
  const label = document.getElementById('saveStatusText');
  if(!wrap || !label) return;
  wrap.classList.remove('saving','error');
  if(state) wrap.classList.add(state);
  label.textContent = text;
}
function isStorageReady(){
  try{ localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); return true; }catch(e){ return false; }
}

function syncEndpoint(){ return SYNC_URL.replace(/\/$/, '') + '/app-data.json'; }
async function pullRemoteState(){
  if(!SYNC_URL) return undefined;
  try{
    const res = await fetch(syncEndpoint(), { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }catch(e){ return NaN; }
}
async function pushRemoteState(state){
  if(!SYNC_URL) return true;
  try{
    const res = await fetch(syncEndpoint(), { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(state) });
    return res.ok;
  }catch(e){ return false; }
}

function mergeArraysById(a, b){
  const map = new Map();
  [...(a||[]), ...(b||[])].forEach(item=>{ if(item && item.id) map.set(item.id, item); });
  return Array.from(map.values());
}
function mergeStates(local, remote){
  if(!remote || typeof remote !== 'object') return local;
  const deletedCaseNumbers = Array.from(new Set([...(remote.deletedCaseNumbers||[]), ...(local.deletedCaseNumbers||[])].map(String)));
  const deletedAgentReviewIds = Array.from(new Set([...(remote.deletedAgentReviewIds||[]), ...(local.deletedAgentReviewIds||[])]));
  return {
    supports: mergeArraysById(remote.supports, local.supports),
    targets: { ...(remote.targets||{}), ...(local.targets||{}) },
    records: mergeArraysById(remote.records, local.records).filter(r=>!deletedCaseNumbers.includes(String(r.caseNumber))),
    seededAugust2026: !!(local.seededAugust2026 || remote.seededAugust2026),
    deletedCaseNumbers,
    augustAccuracyApplied: !!(local.augustAccuracyApplied || remote.augustAccuracyApplied),
    agentReviews: mergeArraysById(remote.agentReviews, local.agentReviews).filter(a=>!deletedAgentReviewIds.includes(a.id)),
    deletedAgentReviewIds,
    viewerSupportId: local.viewerSupportId,
    personalTargets: { ...(remote.personalTargets||{}), ...(local.personalTargets||{}) },
    attendance: { ...(remote.attendance||{}), ...(local.attendance||{}) },
    agentReviewDeletionCounts: { ...(remote.agentReviewDeletionCounts||{}), ...(local.agentReviewDeletionCounts||{}) },
    agentReviewAugust2026Seeded: !!(local.agentReviewAugust2026Seeded || remote.agentReviewAugust2026Seeded),
    historicalDuplicatesCleaned: !!(local.historicalDuplicatesCleaned || remote.historicalDuplicatesCleaned),
  };
}

async function syncNow(){
  if(!SYNC_URL) return;
  const remote = await pullRemoteState();
  if(remote === undefined || Number.isNaN(remote)) return;
  STATE = mergeStates(STATE, remote);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
  await pushRemoteState(STATE);
}

async function loadState(){
  if(!isStorageReady()) return false;
  let raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      STATE = JSON.parse(raw);
      if(SYNC_URL){
        const remote = await pullRemoteState();
        if(remote && !Number.isNaN(remote)) STATE = mergeStates(STATE, remote);
      }
      return true;
    }catch(e){ return false; }
  } else {
    if(SYNC_URL){
      const remote = await pullRemoteState();
      if(remote && typeof remote==='object' && remote.supports){
        STATE = remote;
        return true;
      }
    }
  }
  return true;
}

async function saveState(){
  setSaveStatus('saving', 'Saving…');
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    if(SYNC_URL){
      const remote = await pullRemoteState();
      if(remote && !Number.isNaN(remote)) STATE = mergeStates(STATE, remote);
      await pushRemoteState(STATE);
    }
    const stamp = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    setSaveStatus(null, `Saved at ${stamp}`);
    return true;
  }catch(e){
    setSaveStatus('error', 'Not saved');
    return false;
  }
}

function allMonthsUsed(){
  const set = new Set(STATE.records.map(r=>r.month));
  set.add(currentMonth);
  return Array.from(set).sort();
}
function recordsFor(month, supportId){
  return STATE.records.filter(r=>r.month===month && (!supportId || r.supportId===supportId));
}
function avgPercent(recs){
  if(!recs.length) return null;
  return recs.reduce((s,r)=>s+r.percent,0)/recs.length;
}
function sortedSupports(){
  return [...STATE.supports].sort((a,b)=>a.name.localeCompare(b.name));
}
function personalTargetKey(supportId, month){ return `${supportId}:${month}`; }
function getPersonalTarget(supportId, month){
  const key = personalTargetKey(supportId, month);
  if(STATE.personalTargets[key] !== undefined && STATE.personalTargets[key] !== null && STATE.personalTargets[key] !== '') return Number(STATE.personalTargets[key]);
  return null;
}
function getAttendance(supportId, month){
  return STATE.attendance[personalTargetKey(supportId, month)] || { absent:0, vl:0, ml:0, el:0 };
}
function getWorkingDaysInMonth(month){
  const [y,m] = month.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  let cnt = 0;
  for(let d=1; d<=days; d++){ const day = new Date(y, m-1, d).getDay(); if(day!==0 && day!==6) cnt++; }
  return cnt;
}
function getAdjustedTarget(supportId, month){
  const base = getPersonalTarget(supportId, month);
  if(base===null) return null;
  const att = getAttendance(supportId, month);
  const leave = (Number(att.absent)||0) + (Number(att.vl)||0) + (Number(att.ml)||0) + (Number(att.el)||0);
  const work = getWorkingDaysInMonth(month);
  if(leave<=0 || work<=0) return base;
  return Math.max(0, Math.round(base * Math.max(0, (work - leave) / work)));
}
function scoreBadgeClass(pct){
  if(pct===null || pct===undefined) return 'neutral';
  if(pct>=0.85) return 'green';
  if(pct>=0.70) return 'amber';
  return 'red';
}
function pctStr(p){ return p===null||p===undefined ? '—' : Math.round(p*100)+'%'; }

function toast(msg, isError){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.borderLeftColor = 'var(--red)';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

function setView(view){
  currentView = view;
  if(view !== 'agentReviews') editingAgentReviewId = null;
  renderNav();
  const meta = PAGE_META[view];
  document.getElementById('pageTitle').textContent = meta[0];
  document.getElementById('pageSub').textContent = meta[1];
  render();
}

function renderNav(){
  const nav = document.getElementById('navlist');
  nav.innerHTML = NAV_SUPPORT.map(g=>`
    <div class="navgroup-label">${esc(g.group)}</div>
    ${g.items.map(item=>`<button data-view="${item.view}" class="${item.view===currentView?'active':''}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${item.icon}</svg>${esc(item.label)}</button>`).join('')}
  `).join('');
  nav.querySelectorAll('button[data-view]').forEach(b=>b.addEventListener('click', ()=>setView(b.dataset.view)));
  renderViewerPicker();
}

function renderViewerPicker(){
  const wrap = document.getElementById('viewerPickerWrap');
  if(!STATE.supports.length){ wrap.innerHTML=''; return; }
  const options = sortedSupports().map(s=>`<option value="${s.id}" ${s.id===STATE.viewerSupportId?'selected':''}>${esc(s.name)}</option>`).join('');
  wrap.innerHTML = `<div class="viewer-picker"><label>Viewing as</label><select id="viewerSelect">${options}</select></div>`;
  document.getElementById('viewerSelect').addEventListener('change', async (e)=>{
    STATE.viewerSupportId = e.target.value;
    await saveState();
    render();
  });
}

function ensureViewerSupport(){
  if(!STATE.supports.length) return null;
  if(!STATE.viewerSupportId || !STATE.supports.find(s=>s.id===STATE.viewerSupportId)){
    STATE.viewerSupportId = sortedSupports()[0].id;
  }
  return STATE.viewerSupportId;
}

function populateGlobalMonth(){
  const sel = document.getElementById('globalMonth');
  const months = allMonthsUsed();
  sel.innerHTML = months.map(m=>`<option value="${m}" ${m===currentMonth?'selected':''}>${monthLabel(m)}</option>`).join('');
  document.getElementById('sidebarMonthChip').textContent = monthLabel(currentMonth);
}

function render(){
  populateGlobalMonth();
  const c = document.getElementById('content');
  if(currentView==='myDashboard') c.innerHTML = renderMyDashboard();
  else if(currentView==='myRecords') c.innerHTML = renderMyRecords();
  else if(currentView==='agentReviews') c.innerHTML = renderAgentReviews();
  attachViewHandlers();
}

function buildAgentEntryText(e){
  const lines = [];
  const meta = [];
  if(e.agentName) meta.push('Agent: '+e.agentName);
  if(e.caseNumber) meta.push('Case: '+e.caseNumber);
  if(meta.length){ lines.push(meta.join('   |   ')); lines.push(''); }
  if(e.mode==='review'){
    if(e.category) lines.push('Type of Issue: '+e.category);
    if(e.level) lines.push('Severity: '+e.level);
    lines.push('', '1. Interaction Summary', e.section1||'', '', '2. Gap Identified', e.section2||'', '', '3. Opportunities & Recommended Actions', e.section3||'');
    if(e.section4) lines.push('', '4. Positive Observations', e.section4);
  } else {
    if(e.category) lines.push('Category: '+e.category);
    if(e.level) lines.push('Impact Level: '+e.level);
    lines.push('', '1. What Went Well', e.section1||'', '', '2. Key Strengths Displayed', e.section2||'', '', '3. Business Impact & Recognition', e.section3||'');
  }
  return lines.join('\n');
}

function readAgentReviewForm(){
  const viewerId = ensureViewerSupport();
  const viewer = STATE.supports.find(s=>s.id===viewerId);
  const base = {
    mode: agentReviewKind, supportId: viewerId, supportName: viewer ? viewer.name : '',
    agentName: document.getElementById('ar_agent').value.trim(), caseNumber: document.getElementById('ar_case').value.trim(),
    category: document.getElementById('ar_category').value, level: document.getElementById('ar_level').value
  };
  if(agentReviewKind==='review'){
    base.section1 = document.getElementById('ar_s1').value.trim(); base.section2 = document.getElementById('ar_s2').value.trim();
    base.section3 = document.getElementById('ar_s3').value.trim(); base.section4 = document.getElementById('ar_s4').value.trim();
  } else {
    base.section1 = document.getElementById('ar_c1').value.trim(); base.section2 = document.getElementById('ar_c2').value.trim();
    base.section3 = document.getElementById('ar_c3').value.trim(); base.section4 = '';
  }
  return base;
}

  document.getElementById('ar_levelLabel').textContent = isReview ? 'Severity' : 'Impact';
  document.getElementById('ar_category').innerHTML = (isReview ? AGENT_REVIEW_TYPES : AGENT_COMMENDATION_CATEGORIES).map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
  document.getElementById('ar_level').innerHTML = (isReview ? SEVERITY_LEVELS : IMPACT_LEVELS).map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
}

function renderDashboardAgentEntriesTable(){
  const viewerId = ensureViewerSupport();
  const wrap = document.getElementById('dashAgentEntriesWrap');
  const monthSel = document.getElementById('dashAgentReviewMonthFilter');
  if(!wrap) return;
  const all = STATE.agentReviews.filter(a=>a.supportId===viewerId);
  if(monthSel){
    const months = Array.from(new Set(all.map(a=>(a.date||'').slice(0,7)).filter(Boolean))).sort().reverse();
    const prev = monthSel.value;
    monthSel.innerHTML = `<option value="">All months</option>${months.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('')}`;
    if(months.includes(prev)) monthSel.value = prev;
  }
  const monthFilter = monthSel ? monthSel.value : '';
  const entries = (monthFilter ? all.filter(a=>(a.date||'').slice(0,7)===monthFilter) : all).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  if(!entries.length){ wrap.innerHTML = emptyState('No agent entries yet', 'Log reviews or commendations.', 'agentReviews', 'Go to Agent Review'); return; }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Agent</th><th>Case #</th><th>Entry</th><th>Category</th><th>Summary</th></tr></thead>
      <tbody>
        ${entries.map(a=>`
          <tr>
            <td class="num">${fmtDate(a.date)}</td>
            <td class="agent-name">${esc(a.agentName)||'—'}</td>
            <td class="num">${esc(a.caseNumber)||'—'}</td>
            <td><span class="type-badge ${a.mode==='commendation'?'commendation':''}">${a.mode==='commendation'?'Commendation':'Review'}</span></td>
            <td>${esc(a.category)||'—'}</td>
            <td style="max-width:300px;">${esc((a.section1||'').slice(0,90))}${(a.section1||'').length>90?'…':''}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function renderMyAgentReviewsTable(){
  const viewerId = ensureViewerSupport();
  const wrap = document.getElementById('myAgentReviewsWrap');
  const chip = document.getElementById('ar_countChip');
  const monthSel = document.getElementById('myAgentReviewMonthFilter');
  if(!wrap) return;
  const all = STATE.agentReviews.filter(a=>a.supportId===viewerId);
  if(monthSel){
    const months = Array.from(new Set(all.map(a=>(a.date||'').slice(0,7)).filter(Boolean))).sort().reverse();
    const prev = monthSel.value;
    monthSel.innerHTML = `<option value="">All months</option>${months.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('')}`;
    if(months.includes(prev)) monthSel.value = prev;
  }
  const monthFilter = monthSel ? monthSel.value : '';
  const filtered = monthFilter ? all.filter(a=>(a.date||'').slice(0,7)===monthFilter) : all;
  const entries = filtered.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  if(chip){
    const rc = filtered.filter(a=>a.mode==='review').length;
    const cc = filtered.filter(a=>a.mode==='commendation').length;
    chip.textContent = `${rc} review${rc===1?'':'s'} · ${cc} commendation${cc===1?'':'s'}`;
  }
  if(!entries.length){ wrap.innerHTML = emptyState('No entries yet', 'Add an agent review or commendation above.', null, null); return; }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Agent</th><th>Case #</th><th>Entry</th><th>Category</th><th>Summary</th><th style="text-align:right;">Actions</th></tr></thead>
      <tbody>
        ${entries.map(a=>`
          <tr>
            <td class="num">${fmtDate(a.date)}</td>
            <td class="agent-name">${esc(a.agentName)||'—'}</td>
            <td class="num">${esc(a.caseNumber)||'—'}</td>
            <td><span class="type-badge ${a.mode==='commendation'?'commendation':''}">${a.mode==='commendation'?'Commendation':'Review'}</span></td>
            <td>${esc(a.category)||'—'}</td>
            <td style="max-width:260px;">${esc((a.section1||'').slice(0,90))}${(a.section1||'').length>90?'…':''}</td>
            <td style="text-align:right; white-space:nowrap;">
              <button class="icon-btn" title="Edit" data-ar-edit="${a.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
              <button class="icon-btn danger" title="Delete" data-ar-delete="${a.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;
  wrap.querySelectorAll('[data-ar-edit]').forEach(b=>b.addEventListener('click', ()=>{ editingAgentReviewId = b.dataset.arEdit; setView('agentReviews'); }));
  wrap.querySelectorAll('[data-ar-delete]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Delete this entry?')) return;
    STATE.agentReviews = STATE.agentReviews.filter(a=>a.id!==b.dataset.arDelete);
    STATE.deletedAgentReviewIds.push(b.dataset.arDelete);
    await saveState();
    renderMyAgentReviewsTable();
  }));
}

function emptyState(title, sub, gotoView, cta){
  return `<div class="empty-state">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
    <h4>${esc(title)}</h4><p>${esc(sub)}</p>
    ${gotoView?`<button class="btn ghost" data-goto="${gotoView}">${esc(cta)}</button>`:''}
  </div>`;
}

function attachViewHandlers(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click', ()=>setView(b.dataset.goto)));

  if(currentView==='myDashboard'){
    const form = document.getElementById('attendanceForm');
    if(form){
      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const viewerId = ensureViewerSupport();
        STATE.attendance[personalTargetKey(viewerId, currentMonth)] = {
          absent: Math.max(0, parseInt(document.getElementById('att_absent').value)||0),
          vl: Math.max(0, parseInt(document.getElementById('att_vl').value)||0),
          ml: Math.max(0, parseInt(document.getElementById('att_ml').value)||0),
          el: Math.max(0, parseInt(document.getElementById('att_el').value)||0),
        };
        await saveState();
        render();
        toast('Attendance saved');
      });
    }
    renderDashboardAgentEntriesTable();
    const dashMonthFilterEl = document.getElementById('dashAgentReviewMonthFilter');
    if(dashMonthFilterEl) dashMonthFilterEl.addEventListener('change', renderDashboardAgentEntriesTable);
  }

  if(currentView==='myRecords'){
    renderMyRecordsTable();
    const sel = document.getElementById('myRecordsSupportFilter');
    if(sel){
      sel.addEventListener('change', async ()=>{
        STATE.viewerSupportId = sel.value;
        await saveState();
        renderViewerPicker();
        renderMyRecordsTable();
      });
    }
  }

  if(currentView==='agentReviews'){
    updateAgentReviewModeUI();
    renderMyAgentReviewsTable();
    const monthFilterEl = document.getElementById('myAgentReviewMonthFilter');
    if(monthFilterEl) monthFilterEl.addEventListener('change', renderMyAgentReviewsTable);
    document.querySelectorAll('#arKindToggle [data-ar-kind]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ agentReviewKind = btn.dataset.arKind; updateAgentReviewModeUI(); });
    });
    document.getElementById('ar_previewBtn').addEventListener('click', ()=>{
      const d = readAgentReviewForm();
      document.getElementById('ar_previewText').textContent = buildAgentEntryText(d);
      document.getElementById('ar_previewCard').style.display = 'block';
    });
    document.getElementById('ar_copyBtn').addEventListener('click', ()=>{
      navigator.clipboard.writeText(buildAgentEntryText(readAgentReviewForm())).then(()=>toast('Copied to clipboard'));
    });
    const cancelBtn = document.getElementById('ar_cancelEditBtn');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingAgentReviewId = null; setView('agentReviews'); });
    document.getElementById('agentReviewForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const d = readAgentReviewForm();
      if(editingAgentReviewId){
        const idx = STATE.agentReviews.findIndex(a=>a.id===editingAgentReviewId);
        if(idx>-1) STATE.agentReviews[idx] = { ...STATE.agentReviews[idx], ...d };
        editingAgentReviewId = null;
      } else {
        STATE.agentReviews.push({ id: uid('ar'), date: new Date().toISOString().slice(0,10), createdAt: Date.now(), ...d });
      }
      await saveState();
      toast('Entry saved');
      setView('agentReviews');
    });
  }
}

      <div class="modal-body">
        <div class="letterhead">

function downloadRecordPdf(recordId){
  const r = STATE.records.find(x=>x.id===recordId);
  if(!r) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const marginX = 48;
  const pageWidth = doc.internal.pageSize.getWidth();
  doc.setFillColor(9,60,93);
  doc.rect(0,0,pageWidth,64,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(17);
  doc.text('SEQAS REVIEW', marginX, 34);
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  doc.text(`${r.supportName}  |  ${monthShort(r.month)}`, marginX, 50);

  let y = 96;
  doc.setTextColor(28,43,58);
  const kv = [
    ['DATE OF EVALUATION', fmtDate(r.dateOfEval)], ['CHAT DATE', fmtDate(r.chatDate)],
    ['SUPPORT NAME', r.supportName], ['AGENT NAME', r.agentName],
    ['CASE NUMBER', String(r.caseNumber)], ['REVIEW SCORE', `${r.total}/${MAX_SCORE} (${Math.round(r.percent*100)}%)`]
  ];
  kv.forEach((pair, i)=>{
    const ry = y + i*22;
    doc.setFillColor(i%2===0 ? 234 : 247, i%2===0 ? 244 : 250, i%2===0 ? 251 : 253);
    doc.rect(marginX, ry-14, pageWidth-marginX*2, 22, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(92,98,112);
    doc.text(pair[0], marginX+10, ry);
    doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(28,43,58);
    doc.text(String(pair[1]), marginX+190, ry);
  });
  y += kv.length*22 + 24;

  const sections = [
    ['Support Action', r.supportAction], ['Commitment Met / Observations', r.commitmentObservations],
    ['Additional Actions That Could Be Performed', r.additionalActions], ['TL Commitment and Coaching Notes', r.tlCommitment]
  ];
  sections.forEach(([title, body])=>{
    if(y > 740){ doc.addPage(); y = 56; }
    doc.setDrawColor(59,117,151); doc.setLineWidth(1.4); doc.line(marginX, y, marginX+34, y);
    doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(28,43,58);
    doc.text(title, marginX, y-6);
    y += 16;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    const lines = doc.splitTextToSize(body && body.trim() ? body : '—', pageWidth - marginX*2);
    lines.forEach(line=>{
      if(y > 780){ doc.addPage(); y = 56; }
      doc.text(line, marginX, y); y += 14;
    });
    y += 16;
  });
  doc.save(`SEQAS_${r.supportName.replace(/\s+/g,'_')}_${r.month}.pdf`);
}

async function init(){
  await loadState();
  ensureViewerSupport();
  document.getElementById('globalMonth').addEventListener('change', (e)=>{ currentMonth = e.target.value; render(); });
  document.getElementById('saveStatus').addEventListener('click', ()=>saveState());
  if(STATE.records.some(r=>r.month==='2026-08')) currentMonth = '2026-08';
  setView('myDashboard');
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  setInterval(async ()=>{
    if(currentView==='agentReviews') return;
    const before = JSON.stringify(STATE);
    await syncNow();
    if(JSON.stringify(STATE) !== before) render();
  }, 45000);
}
init();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SUPPORT PERFORMANCE - Supervisor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --pal-navy:#093C5D; --pal-blue:#3B7597; --pal-teal:#6FD1D7; --pal-mint:#5DF8D8;
    --ink:#093C5D; --ink-2:#3B7597; --ink-soft:#2c5470; --paper:#d9eef0; --paper-deep:#c4e3e6;
    --card:#f7fdfd; --rule:#b3d8db; --rule-soft:#cbe6e8; --brass:#3B7597; --brass-dark:#26506b;
    --brass-tint:#d7f2f0; --ink-text:#093C5D; --slate:#365f6e; --slate-soft:#6c959e;
    --green:#0d6b5c; --green-bg:#8ff0dd; --red:#8f2f2f; --red-bg:#f6c9c9;
    --amber:#7a5e10; --amber-bg:#f5dd8f; --neutral-ink:#2c5f68; --neutral-bg:#cdeceb;
    --radius:10px; --radius-sm:6px; --shadow: 0 1px 2px rgba(9,60,93,0.06), 0 4px 16px rgba(9,60,93,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink-text); font-family:'Inter', -apple-system, sans-serif; font-size:14.5px; line-height:1.5; min-height:100vh; }
  ::selection{ background: var(--brass); color:#fff; }
  .app{ display:flex; min-height:100vh; }
  .sidebar{ width:242px; flex-shrink:0; background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%); border-right:1px solid rgba(255,255,255,0.06); color:#dcefe9; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .brand{ padding:26px 22px 18px 22px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .brand .mark{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .brand .seal{ width:30px;height:30px;border-radius:50%; background:rgba(93,248,216,0.14); border:1px solid var(--pal-mint); display:flex;align-items:center;justify-content:center; font-weight:700; font-size:12.5px; color:var(--pal-mint); flex-shrink:0; }
  .brand h1{ font-weight:800; font-size:18px; letter-spacing:-0.01em; margin:0; color:#f2fbf8; }
  .brand .tagline{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:#7fa39b; margin-top:3px; }
  nav.navlist{ padding:16px 12px; flex:1; overflow-y:auto; }
  .navlist button{ width:100%; display:flex; align-items:center; gap:11px; background:none; border:none; color:#a9c9c2; text-align:left; font-family:inherit; font-size:13.5px; font-weight:500; padding:9px 12px; border-radius:var(--radius-sm); cursor:pointer; margin-bottom:2px; transition:background 0.15s, color 0.15s; }
  .navlist button svg{ flex-shrink:0; opacity:0.75; }
  .navlist button:hover{ background:rgba(255,255,255,0.06); color:#f2fbf8; }
  .navlist button.active{ background:rgba(93,248,216,0.16); color:var(--pal-mint); font-weight:600; box-shadow:inset 2px 0 0 var(--pal-mint); }
  .navlist button.active svg{ opacity:1; }
  .navlist .navgroup-label{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#5f7d77; padding:14px 12px 6px 12px; font-weight:600; }
  .sidebar-foot{ padding:14px 22px 18px 22px; border-top:1px solid rgba(255,255,255,0.1); font-size:11.5px; color:#7fa39b; display:flex; flex-direction:column; gap:10px; }
  .sidebar-foot .month-chip{ display:inline-flex;align-items:center;gap:6px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); padding:5px 10px;border-radius:20px; color:#f2fbf8; font-weight:600; font-size:12px; width:fit-content; }
  .save-status{ display:flex; align-items:center; gap:7px; font-size:11px; color:#7fa39b; }
  .save-status .dot{ width:6px; height:6px; border-radius:50%; background:var(--pal-mint); flex-shrink:0; }
  .save-status.error{ cursor:pointer; }
  .save-status.error .dot{ background:#ff9d9d; }
  .save-status.saving .dot{ background:var(--pal-teal); }
  .main{ flex:1; min-width:0; }
  .topbar{ position:sticky; top:0; z-index:5; background:rgba(220,238,234,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--rule); padding:20px 36px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .topbar h2{ font-size:24px; font-weight:700; margin:0; color:var(--ink); }
  .topbar .sub{ color:var(--slate); font-size:12.5px; margin-top:2px; }
  .content{ padding:28px 36px 60px 36px; max-width:1180px; }
  .month-select{ display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--rule); border-radius:20px; padding:6px 6px 6px 14px; }
  .month-select label{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--slate-soft); }
  .month-select select{ border:none; background:none; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--ink); padding:4px 6px; cursor:pointer; }
  .card{ background:var(--card); border:1px solid var(--rule-soft); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-header{ padding:16px 20px; border-bottom:1px solid var(--rule-soft); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .card-header h3{ font-size:16.5px; margin:0; font-weight:700; color:var(--ink); }
  .card-body{ padding:20px; }
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
  .stat-card{ background:var(--card); border:1px solid var(--rule-soft); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .stat-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--brass); }
  .stat-card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--slate-soft); font-weight:600; }
  .stat-card .value{ font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:600; color:var(--ink); margin-top:6px; }
  .stat-card .value small{ font-size:14px; color:var(--slate); font-weight:500; }
  .stat-card .delta{ font-size:12px; margin-top:4px; color:var(--slate); }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate-soft); font-weight:700; padding:9px 12px; border-bottom:2px solid var(--rule); white-space:nowrap; }
  td{ padding:11px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(169,121,58,0.045); }
  .num{ font-family:'IBM Plex Mono',monospace; }
  .agent-name{ font-style:italic; font-weight:500; color:var(--slate); }
  .row-total td{ font-weight:700; background:var(--paper-deep); border-top:2px solid var(--rule); }
  .badge{ display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px; padding:3px 9px; border-radius:20px; }
  .badge.green{ background:var(--green-bg); color:var(--green); }
  .badge.amber{ background:var(--amber-bg); color:var(--amber-dark, var(--amber)); }
  .badge.red{ background:var(--red-bg); color:var(--red); }
  .badge.neutral{ background:var(--paper-deep); color:var(--slate); }
  .type-badge{ display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:var(--brass-tint); color:var(--brass-dark); white-space:nowrap; }
  .type-badge.commendation{ background:var(--green-bg); color:var(--green); }
  button.btn{ font-family:inherit; font-weight:600; font-size:13px; border-radius:var(--radius-sm); cursor:pointer; padding:9px 16px; border:1px solid transparent; transition:all 0.12s; }
  button.btn.primary{ background:var(--ink); color:#eafaf5; }
  button.btn.brass{ background:var(--brass); color:#fff; }
  button.btn.brass:hover{ background:var(--brass-dark); }
  button.btn.ghost{ background:transparent; border:1px solid var(--rule); color:var(--ink-text); }
  button.btn.ghost:hover{ border-color:var(--slate-soft); }
  button.btn.danger{ background:transparent; color:var(--red); border:1px solid var(--red-bg); }
  button.btn.danger:hover{ background:var(--red-bg); }
  button.btn.sm{ padding:5px 11px; font-size:12px; }
  .icon-btn{ background:none; border:none; cursor:pointer; color:var(--slate); padding:6px; border-radius:var(--radius-sm); display:inline-flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ background:var(--paper-deep); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--red-bg); color:var(--red); }
  label.field-label{ display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate); margin-bottom:6px; }
  input[type=text], input[type=number], input[type=date], select, textarea{ width:100%; font-family:inherit; font-size:13.5px; color:var(--ink-text); background:var(--card); border:1px solid var(--rule); border-radius:var(--radius-sm); padding:9px 11px; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  textarea{ resize:vertical; min-height:76px; line-height:1.5; }
  .field{ margin-bottom:16px; }
  .field-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .field-hint{ font-size:11.5px; color:var(--slate-soft); margin-top:5px; }
  .crit-card{ border:1px solid var(--rule-soft); border-left:3px solid var(--rule); border-radius:12px; padding:14px 16px; margin-bottom:12px; background:var(--card); }
  .crit-card[data-band="0"]{ border-left-color:var(--red); background:color-mix(in srgb, var(--red-bg) 40%, var(--card)); }
  .crit-card[data-band="1"]{ border-left-color:var(--amber); background:color-mix(in srgb, var(--amber-bg) 40%, var(--card)); }
  .crit-card[data-band="2"]{ border-left-color:var(--green); background:color-mix(in srgb, var(--green-bg) 40%, var(--card)); }
  .crit-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .crit-head .crit-info{ flex:1; min-width:200px; }
  .crit-name{ font-weight:600; color:var(--ink-text); font-size:13.5px; }
  .crit-desc{ font-size:12px; color:var(--slate-soft); margin-top:3px; }
  .seg{ display:flex; border:1px solid var(--rule); border-radius:20px; overflow:hidden; background:var(--card); flex-shrink:0; }
  .seg button{ border:none; background:none; padding:8px 14px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--slate); cursor:pointer; border-right:1px solid var(--rule); }
  .seg button:last-child{ border-right:none; }
  .seg button.sel-0.active{ background:var(--red-bg); color:var(--red); }
  .seg button.sel-1.active{ background:var(--amber-bg); color:var(--amber); }
  .seg button.sel-2.active{ background:var(--green-bg); color:var(--green); }
  .crit-note{ margin-top:10px; }
  .crit-note textarea{ min-height:52px; font-size:12.5px; padding:8px 10px; }
  .crit-info-toggle{ background:none; border:none; cursor:pointer; font-size:11px; font-weight:600; color:var(--brass); padding:6px 0 0 0; }
  .crit-info-panel{ display:none; margin-top:8px; background:var(--neutral-bg); border:1px solid var(--rule); border-radius:var(--radius-sm); padding:10px 13px; font-size:11.5px; line-height:1.6; color:var(--neutral-ink); white-space:pre-line; }
  .crit-info-panel.open{ display:block; }
  .total-strip{ display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--ink); color:#eafaf5; border-radius:12px; padding:16px 22px; margin:20px 0; }
  .total-strip .tlabel{ font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:#9dc3ba; }
  .total-strip .tval{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; }
  .summary-actions{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; background:var(--paper-deep); border:1px solid var(--rule-soft); border-radius:var(--radius); padding:14px 18px; margin-bottom:18px; }
  .summary-actions p{ margin:0; font-size:12.5px; color:var(--slate); max-width:520px; }
  .filter-bar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .filter-bar select, .filter-bar input{ width:auto; }
  .count-table th:not(:first-child){ text-align:center; }
  .count-table td.num{ text-align:center; }
  .target-input{ width:64px !important; text-align:center; padding:6px 4px !important; font-family:'IBM Plex Mono',monospace; font-weight:600; display:inline-block; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .support-chip{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--rule-soft); padding:9px 8px 9px 14px; border-radius:20px; font-size:13px; font-weight:600; box-shadow:var(--shadow); }
  .support-chip .initial{ width:22px;height:22px;border-radius:50%; background:var(--ink); color:#eafaf5; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; }
  .toast-wrap{ position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px; }
  .toast{ background:var(--ink); color:#eafaf5; padding:12px 18px; border-radius:10px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,0.25); display:flex; align-items:center; gap:10px; border-left:3px solid var(--brass); }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,29,49,0.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; z-index:100; overflow-y:auto; }
  .modal{ background:var(--paper); border-radius:5px; width:100%; max-width:680px; box-shadow:0 20px 60px rgba(0,0,0,0.35); border:1px solid var(--rule); }
  .modal-head{ padding:18px 24px; border-bottom:1px solid var(--rule); display:flex; align-items:center; justify-content:space-between; }
  .modal-head h3{ margin:0; font-size:18px; }
  .modal-body{ padding:22px 24px; max-height:70vh; overflow-y:auto; }
  .modal-foot{ padding:16px 24px; border-top:1px solid var(--rule); display:flex; justify-content:flex-end; gap:10px; }
  .letterhead{ border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; background:var(--card); }
  .letterhead .lh-band{ background:var(--ink); color:#eafaf5; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; }
  .letterhead .lh-band h4{ margin:0; font-size:16px; font-weight:700; }
  .letterhead .lh-body{ padding:20px 22px; }
  .kv-table{ width:100%; border-collapse:collapse; }
  .kv-table td{ padding:8px 12px; border:1px solid var(--rule); font-size:13px; }
  .kv-table td.k{ background:var(--paper-deep); font-weight:700; width:210px; text-transform:uppercase; font-size:11px; letter-spacing:0.04em; color:var(--slate); }
  .section-block{ margin-top:18px; }
  .section-block h5{ font-size:14px; margin:0 0 6px 0; color:var(--ink); font-weight:700; border-bottom:1.5px solid var(--brass); padding-bottom:5px; display:inline-block; }
  .section-block p{ margin:8px 0 0 0; color:var(--ink-text); white-space:pre-wrap; }
  .empty-state{ text-align:center; padding:56px 20px; color:var(--slate-soft); }
  .empty-state svg{ opacity:0.5; margin-bottom:12px; }
  .empty-state h4{ font-size:17px; margin:0 0 6px 0; color:var(--ink); }
  .empty-state p{ font-size:13px; margin:0 0 18px 0; }
  .loading-screen{ position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:999; }
  .loading-screen .seal-lg{ width:52px;height:52px;border-radius:50%; border:2px solid var(--brass); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; color:var(--brass); }
</style>
</head>
<body>

<div id="loading" class="loading-screen">
  <div class="seal-lg">SP</div>
  <p>Loading Supervisor Portal…</p>
</div>

<div class="app" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <div class="seal">SP</div>
        <h1>Supervisor</h1>
      </div>
      <div class="tagline">Admin &amp; Quality Control</div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div class="sidebar-foot">
      <div class="save-status" id="saveStatus"><span class="dot"></span><span id="saveStatusText">All changes saved</span></div>
      <div class="month-chip" id="sidebarMonthChip">—</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="sub" id="pageSub">Automatic scoring and monthly averages across the team</div>
      </div>
      <div class="month-select">
        <label>Month</label>
        <select id="globalMonth"></select>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>

<script>
const CRITERIA = [
  { key:'identification', name:'Identification', max:2, desc:'Reviewed template before responding; correct sub-template; verified contract.' },
  { key:'relationship', name:'Maintaining Customer Relationship', max:2, desc:'Guided the agent through troubleshooting; encouraged independent problem-solving.' },
  { key:'diagnosis', name:'Diagnosis', max:2, desc:'Asked targeted probing questions; reviewed case notes; reached root cause.' },
  { key:'accuracy', name:'Accuracy of Solution', max:2, desc:'Consistently provided accurate answers to agent questions.' },
  { key:'communication', name:'Clear Communication', max:2, desc:'Explained technical issues in simple, understandable terms.' },
  { key:'resource', name:'Resource Utilization', max:2, desc:'Referenced KB articles and used tools to validate diagnosis.' },
  { key:'logging', name:'Call Logging', max:2, desc:'Completed dispatch/log pull; informed agent of chat transfer.' },
  { key:'efficiency', name:'Interaction Handling / Agent Efficiency', max:2, desc:'Consistently provided timely answers to agent questions.' },
  { key:'compliance', name:'Compliance and Professional Conduct', max:1, desc:'Adhered to data privacy and policy; no avoidance or fabricated notes.' }
];
const MAX_SCORE = 17;
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

let STATE = {
  supports: [], targets: {}, records: [], seededAugust2026: false, deletedCaseNumbers: [],
  augustAccuracyApplied: false, agentReviews: [], viewerSupportId: null, personalTargets: {},
  attendance: {}, agentReviewDeletionCounts: {}, agentReviewAugust2026Seeded: false,
  historicalDuplicatesCleaned: false, deletedAgentReviewIds: []
};

let currentView = 'dashboard';
let currentMonth = monthKey(new Date());
let editingRecordId = null;

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(mk){ const [y,m]=mk.split('-').map(Number); return MONTH_NAMES[m-1]+' '+y; }
function monthShort(mk){ const [y,m]=mk.split('-').map(Number); return MONTH_ABBR[m-1]+' '+y; }
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}); }

const STORAGE_KEY = 'seqas-review-app-data';
const SYNC_URL_KEY = 'seqas-sync-url';
const DEFAULT_SYNC_URL = 'https://support-performance-ec0a1-default-rtdb.firebaseio.com';
let SYNC_URL = DEFAULT_SYNC_URL;
try{
  const stored = localStorage.getItem(SYNC_URL_KEY);
  SYNC_URL = (stored === null) ? DEFAULT_SYNC_URL : stored;
}catch(e){ SYNC_URL = DEFAULT_SYNC_URL; }

function setSaveStatus(state, text){
  const wrap = document.getElementById('saveStatus');
  const label = document.getElementById('saveStatusText');
  if(!wrap || !label) return;
  wrap.classList.remove('saving','error');
  if(state) wrap.classList.add(state);
  label.textContent = text;
}
function isStorageReady(){ try{ localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); return true; }catch(e){ return false; } }

function syncEndpoint(){ return SYNC_URL.replace(/\/$/, '') + '/app-data.json'; }
async function pullRemoteState(){
  if(!SYNC_URL) return undefined;
  try{
    const res = await fetch(syncEndpoint(), { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }catch(e){ return NaN; }
}
async function pushRemoteState(state){
  if(!SYNC_URL) return true;
  try{
    const res = await fetch(syncEndpoint(), { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(state) });
    return res.ok;
  }catch(e){ return false; }
}

function mergeArraysById(a, b){
  const map = new Map();
  [...(a||[]), ...(b||[])].forEach(item=>{ if(item && item.id) map.set(item.id, item); });
  return Array.from(map.values());
}
function mergeStates(local, remote){
  if(!remote || typeof remote !== 'object') return local;
  const deletedCaseNumbers = Array.from(new Set([...(remote.deletedCaseNumbers||[]), ...(local.deletedCaseNumbers||[])].map(String)));
  const deletedAgentReviewIds = Array.from(new Set([...(remote.deletedAgentReviewIds||[]), ...(local.deletedAgentReviewIds||[])]));
  return {
    supports: mergeArraysById(remote.supports, local.supports),
    targets: { ...(remote.targets||{}), ...(local.targets||{}) },
    records: mergeArraysById(remote.records, local.records).filter(r=>!deletedCaseNumbers.includes(String(r.caseNumber))),
    seededAugust2026: !!(local.seededAugust2026 || remote.seededAugust2026),
    deletedCaseNumbers,
    augustAccuracyApplied: !!(local.augustAccuracyApplied || remote.augustAccuracyApplied),
    agentReviews: mergeArraysById(remote.agentReviews, local.agentReviews).filter(a=>!deletedAgentReviewIds.includes(a.id)),
    deletedAgentReviewIds,
    viewerSupportId: local.viewerSupportId,
    personalTargets: { ...(remote.personalTargets||{}), ...(local.personalTargets||{}) },
    attendance: { ...(remote.attendance||{}), ...(local.attendance||{}) },
    agentReviewDeletionCounts: { ...(remote.agentReviewDeletionCounts||{}), ...(local.agentReviewDeletionCounts||{}) },
    agentReviewAugust2026Seeded: !!(local.agentReviewAugust2026Seeded || remote.agentReviewAugust2026Seeded),
    historicalDuplicatesCleaned: !!(local.historicalDuplicatesCleaned || remote.historicalDuplicatesCleaned),
  };
}

async function syncNow(){
  if(!SYNC_URL) return;
  const remote = await pullRemoteState();
  if(remote === undefined || Number.isNaN(remote)) return;
  STATE = mergeStates(STATE, remote);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
  await pushRemoteState(STATE);
}

async function loadState(){
  if(!isStorageReady()) return false;
  let raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      STATE = JSON.parse(raw);
      if(SYNC_URL){
        const remote = await pullRemoteState();
        if(remote && !Number.isNaN(remote)) STATE = mergeStates(STATE, remote);
      }
      return true;
    }catch(e){ return false; }
  } else {
    if(SYNC_URL){
      const remote = await pullRemoteState();
      if(remote && typeof remote==='object' && remote.supports){
        STATE = remote;
        return true;
      }
    }
  }
  return true;
}

async function saveState(){
  setSaveStatus('saving', 'Saving…');
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    if(SYNC_URL){
      const remote = await pullRemoteState();
      if(remote && !Number.isNaN(remote)) STATE = mergeStates(STATE, remote);
      await pushRemoteState(STATE);
    }
    const stamp = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    setSaveStatus(null, `Saved at ${stamp}`);
    return true;
  }catch(e){
    setSaveStatus('error', 'Not saved');
    return false;
  }
}

function allMonthsUsed(){
  const set = new Set(STATE.records.map(r=>r.month));
  set.add(currentMonth);
  return Array.from(set).sort();
}
function recordsFor(month, supportId){
  return STATE.records.filter(r=>r.month===month && (!supportId || r.supportId===supportId));
}
function avgPercent(recs){
  if(!recs.length) return null;
  return recs.reduce((s,r)=>s+r.percent,0)/recs.length;
}
function sortedSupports(){
  return [...STATE.supports].sort((a,b)=>a.name.localeCompare(b.name));
}
function getTarget(month){
  return STATE.targets[month] !== undefined ? STATE.targets[month] : 16;
}
function personalTargetKey(supportId, month){ return `${supportId}:${month}`; }
function getPersonalTarget(supportId, month){
  const key = personalTargetKey(supportId, month);
  if(STATE.personalTargets[key] !== undefined && STATE.personalTargets[key] !== null && STATE.personalTargets[key] !== '') return Number(STATE.personalTargets[key]);
  return null;
}
function getAttendance(supportId, month){
  return STATE.attendance[personalTargetKey(supportId, month)] || { absent:0, vl:0, ml:0, el:0 };
}
function getWorkingDaysInMonth(month){
  const [y,m] = month.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  let cnt = 0;
  for(let d=1; d<=days; d++){ const day = new Date(y, m-1, d).getDay(); if(day!==0 && day!==6) cnt++; }
  return cnt;
}
function getAdjustedTarget(supportId, month){
  const base = getPersonalTarget(supportId, month);
  if(base===null) return null;
  const att = getAttendance(supportId, month);
  const leave = (Number(att.absent)||0) + (Number(att.vl)||0) + (Number(att.ml)||0) + (Number(att.el)||0);
  const work = getWorkingDaysInMonth(month);
  if(leave<=0 || work<=0) return base;
  return Math.max(0, Math.round(base * Math.max(0, (work - leave) / work)));
}
function scoreBadgeClass(pct){
  if(pct===null || pct===undefined) return 'neutral';
  if(pct>=0.85) return 'green';
  if(pct>=0.70) return 'amber';
  return 'red';
}
function pctStr(p){ return p===null||p===undefined ? '—' : Math.round(p*100)+'%'; }

function toast(msg, isError){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.borderLeftColor = 'var(--red)';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

            <td><span class="badge ${scoreBadgeClass(r.percent)}">${r.total}/${MAX_SCORE} · ${pctStr(r.percent)}</span></td>
            <td style="text-align:right; white-space:nowrap;">
              <button class="icon-btn" title="View / Export" data-export="${r.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3M6 9l6 6 6-6"/><path d="M4 17v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></button>
              <button class="icon-btn" title="Edit" data-edit="${r.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
              <button class="icon-btn danger" title="Delete" data-delete="${r.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;
  wrap.querySelectorAll('[data-export]').forEach(b=>b.addEventListener('click', ()=>openExportModal(b.dataset.export)));
  wrap.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{ editingRecordId=b.dataset.edit; setView('new'); }));
  wrap.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Delete this evaluation?')) return;
    const rec = STATE.records.find(r=>r.id===b.dataset.delete);
    STATE.records = STATE.records.filter(r=>r.id!==b.dataset.delete);
    if(rec && rec.caseNumber) STATE.deletedCaseNumbers.push(String(rec.caseNumber));
    await saveState();
    renderRecordsTable();
  }));
}

function renderSupports(){
  const chips = sortedSupports().map(s=>{
    const initials = s.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const count = STATE.records.filter(r=>r.supportId===s.id).length;
    return `<div class="support-chip">
      <span class="initial">${esc(initials)}</span><span>${esc(s.name)}</span>
      <span style="color:var(--slate-soft); font-weight:400; font-size:11.5px;">${count} evaluations</span>
      <button class="icon-btn danger" data-remove-support="${s.id}" title="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>`;
  }).join('');

  return `
  <div class="card">
    <div class="card-header"><h3>Add Support Member</h3></div>
    <div class="card-body">
      <form id="addSupportForm" style="display:flex; gap:10px;">
        <input type="text" id="newSupportName" placeholder="Full name" style="flex:1;" required>
        <button type="submit" class="btn brass">Add Support</button>
      </form>
    </div>
  </div>

  <div class="card" style="margin-top:20px;">
    <div class="card-header"><h3>Active Roster (${STATE.supports.length})</h3></div>
    <div class="card-body">${STATE.supports.length ? `<div class="chip-row">${chips}</div>` : emptyState('No supports yet', 'Add roster members above.', null, null)}</div>
  </div>

  <div class="card" style="margin-top:20px;">
    <div class="card-header"><h3>Backup &amp; Sync</h3></div>
    <div class="card-body">
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
        <button type="button" class="btn brass" id="downloadBackupBtn">Download JSON Backup</button>
        <button type="button" class="btn ghost" id="restoreBackupBtn">Restore from Backup</button>
        <input type="file" id="restoreFileInput" accept="application/json" style="display:none;">
      </div>
      <div class="field"><label class="field-label">Team Sync Realtime Database URL</label><input type="text" id="syncUrlInput" value="${esc(SYNC_URL)}"></div>
      <div style="display:flex; gap:10px;"><button type="button" class="btn brass" id="saveSyncUrlBtn">Save URL</button><button type="button" class="btn ghost" id="syncNowBtn">Sync Now</button></div>
    </div>
  </div>`;
}

function renderDashAllAgentReviewsTable(){
  const wrap = document.getElementById('dashAllAgentReviewsWrap');
  if(!wrap) return;
  const supF = document.getElementById('dashArFilterSupport')?.value || '';
  const kindF = document.getElementById('dashArFilterKind')?.value || '';
  let entries = STATE.agentReviews.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(supF) entries = entries.filter(a=>a.supportId===supF);
  if(kindF) entries = entries.filter(a=>a.mode===kindF);

  if(!entries.length){ wrap.innerHTML = emptyState('No agent reviews found', 'Reviews logged by team members will appear here.', null, null); return; }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Support</th><th>Agent</th><th>Case #</th><th>Type</th><th>Category</th><th>Summary</th><th style="text-align:right;">Actions</th></tr></thead>
      <tbody>
        ${entries.map(a=>`
          <tr>
            <td class="num">${fmtDate(a.date)}</td>
            <td style="font-weight:600;">${esc(a.supportName)}</td>
            <td class="agent-name">${esc(a.agentName)||'—'}</td>
            <td class="num">${esc(a.caseNumber)||'—'}</td>
            <td><span class="type-badge ${a.mode==='commendation'?'commendation':''}">${a.mode==='commendation'?'Commendation':'Review'}</span></td>
            <td>${esc(a.category)||'—'}</td>
            <td style="max-width:260px;">${esc((a.section1||'').slice(0,80))}${(a.section1||'').length>80?'…':''}</td>
            <td style="text-align:right;">
              <button class="icon-btn" title="View Full Entry" data-ar-view="${a.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;
  wrap.querySelectorAll('[data-ar-view]').forEach(b=>b.addEventListener('click', ()=>openAgentReviewModal(b.dataset.arView)));
}

function openAgentReviewModal(id){
  const a = STATE.agentReviews.find(x=>x.id===id);
  if(!a) return;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-backdrop" id="arModalBackdrop">
    <div class="modal">
      <div class="modal-head"><h3>Agent ${a.mode==='commendation'?'Commendation':'Review'} Details</h3><button class="icon-btn" id="closeArModal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="modal-body">
        <table class="kv-table">
          <tr><td class="k">Date</td><td>${fmtDate(a.date)}</td></tr>
          <tr><td class="k">Support</td><td>${esc(a.supportName)}</td></tr>
          <tr><td class="k">Agent</td><td class="agent-name">${esc(a.agentName)||'—'}</td></tr>
          <tr><td class="k">Case Number</td><td>${esc(a.caseNumber)||'—'}</td></tr>
          <tr><td class="k">Category</td><td>${esc(a.category)||'—'}</td></tr>
          <tr><td class="k">Level</td><td>${esc(a.level)||'—'}</td></tr>
        </table>
        <div class="section-block"><h5>1. ${a.mode==='review'?'Interaction Summary':'What Went Well'}</h5><p>${esc(a.section1)||'—'}</p></div>
        <div class="section-block"><h5>2. ${a.mode==='review'?'Gap Identified':'Key Strengths Displayed'}</h5><p>${esc(a.section2)||'—'}</p></div>
        <div class="section-block"><h5>3. ${a.mode==='review'?'Recommended Actions':'Business Impact & Recognition'}</h5><p>${esc(a.section3)||'—'}</p></div>
        ${a.section4?`<div class="section-block"><h5>4. Positive Observations</h5><p>${esc(a.section4)}</p></div>`:''}
      </div>
      <div class="modal-foot"><button class="btn brass" id="closeArBtn">Close</button></div>
    </div>
  </div>`;
  const close = ()=>root.innerHTML='';
  document.getElementById('closeArModal').addEventListener('click', close);
  document.getElementById('closeArBtn').addEventListener('click', close);
  document.getElementById('arModalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='arModalBackdrop') close(); });
}

function attachViewHandlers(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click', ()=>setView(b.dataset.goto)));

  if(currentView==='dashboard'){
    renderDashAllAgentReviewsTable();
    document.getElementById('dashArFilterSupport').addEventListener('change', renderDashAllAgentReviewsTable);
    document.getElementById('dashArFilterKind').addEventListener('change', renderDashAllAgentReviewsTable);
  }

  if(currentView==='counts'){
    document.querySelectorAll('[data-target-month]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        STATE.targets[inp.dataset.targetMonth] = Math.max(0, parseInt(inp.value)||0);
        await saveState(); render(); toast('Target updated');
      });
    });
    document.querySelectorAll('[data-personal-target-support]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const key = personalTargetKey(inp.dataset.personalTargetSupport, inp.dataset.personalTargetMonth);
        if(inp.value==='') delete STATE.personalTargets[key];
        else STATE.personalTargets[key] = Math.max(0, parseInt(inp.value)||0);
        await saveState(); toast('Personal target updated');
      });
    });
  }

  if(currentView==='new'){
    let liveScores = editingRecordId ? {...STATE.records.find(r=>r.id===editingRecordId).scores} : {};
    let liveNotes = editingRecordId ? {...(STATE.records.find(r=>r.id===editingRecordId).criteriaNotes||{})} : {};

    document.querySelectorAll('[data-score-key]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = btn.dataset.scoreKey, val = parseInt(btn.dataset.scoreVal);
        liveScores[key] = val;
        document.querySelectorAll(`[data-score-key="${key}"]`).forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const card = document.querySelector(`.crit-card[data-crit-key="${key}"]`);
        if(card) card.dataset.band = String(val);
        const total = Object.values(liveScores).reduce((s,v)=>s+v,0);
        document.getElementById('liveTotal').innerHTML = `${total} <small>/ ${MAX_SCORE}</small>`;
        document.getElementById('livePercent').textContent = Math.round((total/MAX_SCORE)*100)+'%';
      });
    });

    document.querySelectorAll('textarea[data-note-key]').forEach(ta=>{
      ta.addEventListener('input', ()=>{ liveNotes[ta.dataset.noteKey] = ta.value; });
    });

    document.getElementById('feedbackForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(Object.keys(liveScores).length < CRITERIA.length){ toast('Please score every criterion.', true); return; }
      const total = Object.values(liveScores).reduce((s,v)=>s+v,0);
      const supportId = document.getElementById('f_support').value;
      const record = {
        id: editingRecordId || uid('rec'),
        month: document.getElementById('f_month').value || currentMonth,
        supportId, supportName: STATE.supports.find(s=>s.id===supportId)?.name || '',
        dateOfEval: document.getElementById('f_evalDate').value,
        chatDate: document.getElementById('f_chatDate').value,
        agentName: document.getElementById('f_agent').value,
        caseNumber: document.getElementById('f_case').value,
        scores: liveScores, criteriaNotes: liveNotes, total, percent: total/MAX_SCORE,
        supportAction: document.getElementById('f_supportAction').value,
        commitmentObservations: document.getElementById('f_commitment').value,
        additionalActions: document.getElementById('f_additional').value,
        tlCommitment: document.getElementById('f_tlNotes').value,
        createdAt: Date.now(), updatedAt: Date.now()
      };
      if(editingRecordId){
        const idx = STATE.records.findIndex(r=>r.id===editingRecordId);
        STATE.records[idx] = record;
      } else {
        STATE.records.push(record);
      }
      await saveState();
      toast('Evaluation saved');
      setView('records');
    });
  }

  if(currentView==='records'){
    renderRecordsTable();
    document.getElementById('filterMonth').addEventListener('change', renderRecordsTable);
    document.getElementById('filterSupport').addEventListener('change', renderRecordsTable);
  }

  if(currentView==='supports'){
    document.getElementById('addSupportForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const inp = document.getElementById('newSupportName');
      if(!inp.value.trim()) return;
      STATE.supports.push({ id: uid('sup'), name: inp.value.trim() });
      await saveState(); render(); toast('Support added');
    });
    document.querySelectorAll('[data-remove-support]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm('Remove support from active roster?')) return;
        STATE.supports = STATE.supports.filter(s=>s.id!==btn.dataset.removeSupport);
        await saveState(); render(); toast('Support removed');
      });
    });
    document.getElementById('downloadBackupBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(STATE, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `SEQAS_Backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click(); URL.revokeObjectURL(url);
    });
    document.getElementById('restoreBackupBtn').addEventListener('click', ()=>document.getElementById('restoreFileInput').click());
    document.getElementById('restoreFileInput').addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async (ev)=>{
        try{
          STATE = JSON.parse(ev.target.result);
          await saveState(); render(); toast('Backup restored');
        }catch(err){ toast('Invalid JSON backup.', true); }
      };
      reader.readAsText(file);
    });
    document.getElementById('saveSyncUrlBtn').addEventListener('click', async ()=>{
      SYNC_URL = document.getElementById('syncUrlInput').value.trim();
      localStorage.setItem(SYNC_URL_KEY, SYNC_URL);
      await syncNow(); toast('Sync URL saved'); render();
    });
    document.getElementById('syncNowBtn').addEventListener('click', async ()=>{
      await syncNow(); toast('Synced'); render();
    });
  }
}

  root.innerHTML = `
  <div class="modal-backdrop" id="exportBackdrop">
    <div class="modal">
      <div class="modal-head"><h3>Evaluation Review</h3><button class="icon-btn" id="closeExportModal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="modal-body">
        <div class="letterhead">
          <div class="lh-band"><h4>SEQAS REVIEW — ${esc(r.supportName)}</h4><span style="font-size:12px; color:#a9d3c9;">${monthShort(r.month)}</span></div>
          <div class="lh-body">
            <table class="kv-table">
              <tr><td class="k">Date of Evaluation</td><td>${fmtDate(r.dateOfEval)}</td></tr>
              <tr><td class="k">Chat Date</td><td>${fmtDate(r.chatDate)}</td></tr>
              <tr><td class="k">Support Name</td><td>${esc(r.supportName)}</td></tr>
              <tr><td class="k">Agent Name</td><td class="agent-name">${esc(r.agentName)}</td></tr>
              <tr><td class="k">Case Number</td><td>${esc(r.caseNumber)}</td></tr>
              <tr><td class="k">Review Score</td><td>${r.total}/${MAX_SCORE} (${pctStr(r.percent)})</td></tr>
            </table>
            <div class="section-block"><h5>Support Action</h5><p>${esc(r.supportAction)||'—'}</p></div>
            <div class="section-block"><h5>Commitment Met / Observations</h5><p>${esc(r.commitmentObservations)||'—'}</p></div>
            <div class="section-block"><h5>Additional Actions</h5><p>${esc(r.additionalActions)||'—'}</p></div>
            <div class="section-block"><h5>TL Commitment and Coaching Notes</h5><p>${esc(r.tlCommitment)||'—'}</p></div>
          </div>
        </div>
      </div>
      <div class="modal-foot"><button class="btn brass" id="closeExportBtn">Close</button></div>
    </div>
  </div>`;
  const close = ()=>root.innerHTML='';
  document.getElementById('closeExportModal').addEventListener('click', close);
  document.getElementById('closeExportBtn').addEventListener('click', close);
  document.getElementById('exportBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='exportBackdrop') close(); });
}

function emptyState(title, sub, gotoView, cta){
  return `<div class="empty-state">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
    <h4>${esc(title)}</h4><p>${esc(sub)}</p>
    ${gotoView?`<button class="btn ghost" data-goto="${gotoView}">${esc(cta)}</button>`:''}
  </div>`;
}

async function init(){
  await loadState();
  document.getElementById('globalMonth').addEventListener('change', (e)=>{ currentMonth = e.target.value; render(); });
  document.getElementById('saveStatus').addEventListener('click', ()=>saveState());
  if(STATE.records.some(r=>r.month==='2026-08')) currentMonth = '2026-08';
  setView('dashboard');
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  setInterval(async ()=>{
    if(currentView==='new') return;
    const before = JSON.stringify(STATE);
    await syncNow();
    if(JSON.stringify(STATE) !== before) render();
  }, 45000);
}
init();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SUPERVISOR ACCESS - SUPPORT PERFORMANCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --pal-navy:#093C5D;
    --pal-blue:#3B7597;
    --pal-teal:#6FD1D7;
    --pal-mint:#5DF8D8;

    --ink:#093C5D;
    --ink-2:#3B7597;
    --ink-soft:#2c5470;
    --paper:#d9eef0;
    --paper-deep:#c4e3e6;
    --card:#f7fdfd;
    --rule:#b3d8db;
    --rule-soft:#cbe6e8;
    --brass:#3B7597;
    --brass-dark:#26506b;
    --brass-tint:#d7f2f0;
    --ink-text:#093C5D;
    --slate:#365f6e;
    --slate-soft:#6c959e;
    --green:#0d6b5c;
    --green-bg:#8ff0dd;
    --red:#8f2f2f;
    --red-bg:#f6c9c9;
    --amber:#7a5e10;
    --amber-bg:#f5dd8f;
    --neutral-ink:#2c5f68;
    --neutral-bg:#cdeceb;
    --radius:10px;
    --radius-sm:6px;
    --shadow: 0 1px 2px rgba(9,60,93,0.06), 0 4px 16px rgba(9,60,93,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink-text);
    font-family:'Inter', -apple-system, sans-serif;
    font-size:14.5px;
    line-height:1.5;
    min-height:100vh;
  }
  ::selection{ background: var(--brass); color:#fff; }
  .app{ display:flex; min-height:100vh; }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:242px; flex-shrink:0;
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    border-right:1px solid rgba(255,255,255,0.06);
    color:#dcefe9; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{ padding:26px 22px 18px 22px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .brand .mark{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .brand .seal{
    width:30px;height:30px;border-radius:50%; background:rgba(93,248,216,0.14); border:1px solid var(--pal-mint);
    display:flex;align-items:center;justify-content:center; font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px; color:var(--pal-mint); flex-shrink:0;
  }
  .brand h1{ font-family:'Inter',sans-serif; font-weight:800; font-size:18px; letter-spacing:-0.01em; margin:0; color:#f2fbf8; }
  .brand .tagline{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:#7fa39b; margin-top:3px; }
  .type-badge{
    display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
    background:var(--brass-tint); color:var(--brass-dark); white-space:nowrap;
  }
  .type-badge.commendation{ background:var(--green-bg); color:var(--green); }
  
  nav.navlist{ padding:16px 12px; flex:1; overflow-y:auto; }
  .navlist button{
    width:100%; display:flex; align-items:center; gap:11px; background:none; border:none; color:#a9c9c2;
    text-align:left; font-family:inherit; font-size:13.5px; font-weight:500; padding:9px 12px; border-radius:var(--radius-sm);
    cursor:pointer; letter-spacing:0.01em; margin-bottom:2px; transition:background 0.15s, color 0.15s;
  }
  .navlist button svg{ flex-shrink:0; opacity:0.75; }
  .navlist button:hover{ background:rgba(255,255,255,0.06); color:#f2fbf8; }
  .navlist button.active{ background:rgba(93,248,216,0.16); color:var(--pal-mint); font-weight:600; box-shadow: inset 2px 0 0 var(--pal-mint); }
  .navlist button.active svg{ opacity:1; }
  .navlist .navgroup-label{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#5f7d77; padding:14px 12px 6px 12px; font-weight:600; }
  .sidebar-foot{
    padding:14px 22px 18px 22px; border-top:1px solid rgba(255,255,255,0.1); font-size:11.5px; color:#7fa39b; display:flex; flex-direction:column; gap:10px;
  }
  .sidebar-foot .month-chip{
    display:inline-flex;align-items:center;gap:6px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14);
    padding:5px 10px;border-radius:20px; color:#f2fbf8; font-weight:600; font-size:12px; width:fit-content;
  }
  .save-status{ display:flex; align-items:center; gap:7px; font-size:11px; color:#7fa39b; }
  .save-status .dot{ width:6px; height:6px; border-radius:50%; background:var(--pal-mint); flex-shrink:0; }
  .save-status.error{ cursor:pointer; }
  .save-status.error .dot{ background:#ff9d9d; }
  .save-status.saving .dot{ background:var(--pal-teal); }

  /* ---------- MAIN ---------- */
  .main{ flex:1; min-width:0; }
  .topbar{
    position:sticky; top:0; z-index:5; background:rgba(220,238,234,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--rule); padding:20px 36px; display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .topbar h2{ font-family:'Inter',serif; font-size:24px; font-weight:700; margin:0; color:var(--ink); }
  .topbar .sub{ color:var(--slate); font-size:12.5px; margin-top:2px;}
  .content{ padding:28px 36px 60px 36px; max-width:1180px; }

  .month-select{
    display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--rule); border-radius:20px; padding:6px 6px 6px 14px;
  }
  .month-select label{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--slate-soft); }
  .month-select select{
    border:none; background:none; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--ink); padding:4px 6px; cursor:pointer;
  }

  /* ---------- CARDS / COMMON ---------- */
  .card{ background:var(--card); border:1px solid var(--rule-soft); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-header{ padding:16px 20px; border-bottom:1px solid var(--rule-soft); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .card-header h3{ font-family:'Inter',serif; font-size:16.5px; margin:0; font-weight:700; color:var(--ink);}
  .card-body{ padding:20px; }

  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px;}
  .stat-card{
    background:var(--card); border:1px solid var(--rule-soft); border-radius:var(--radius);
    padding:18px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .stat-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--brass); }
  .stat-card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--slate-soft); font-weight:600;}
  .stat-card .value{ font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:600; color:var(--ink); margin-top:6px;}
  .stat-card .value small{ font-size:14px; color:var(--slate); font-weight:500;}
  .stat-card .delta{ font-size:12px; margin-top:4px; color:var(--slate);}

  table{ width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--slate-soft); font-weight:700; padding:9px 12px; border-bottom:2px solid var(--rule); white-space:nowrap;
  }
  td{ padding:11px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(169,121,58,0.045); }
  .num{ font-family:'IBM Plex Mono',monospace; }
  .agent-name{ font-style:italic; font-weight:500; color:var(--slate); }
  .row-total td{ font-weight:700; background:var(--paper-deep); border-top:2px solid var(--rule); }

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:12.5px; padding:3px 9px; border-radius:20px;
  }
  .badge.green{ background:var(--green-bg); color:var(--green); }
  .badge.amber{ background:var(--amber-bg); color:var(--amber-dark, var(--amber)); }
  .badge.red{ background:var(--red-bg); color:var(--red); }
  .badge.neutral{ background:var(--paper-deep); color:var(--slate); }

  button.btn{
    font-family:inherit; font-weight:600; font-size:13px; border-radius:var(--radius-sm); cursor:pointer;
    padding:9px 16px; border:1px solid transparent; transition:all 0.12s;
  }
  button.btn.primary{ background:var(--ink); color:#eafaf5; }
  button.btn.primary:hover{ background:var(--ink-2); }
  button.btn.brass{ background:var(--brass); color:#fff; }
  button.btn.brass:hover{ background:var(--brass-dark); }
  button.btn.ghost{ background:transparent; border:1px solid var(--rule); color:var(--ink-text); }
  button.btn.ghost:hover{ border-color:var(--slate-soft); }
  button.btn.danger{ background:transparent; color:var(--red); border:1px solid var(--red-bg); }
  button.btn.danger:hover{ background:var(--red-bg); }
  button.btn.sm{ padding:5px 11px; font-size:12px; }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .icon-btn{
    background:none; border:none; cursor:pointer; color:var(--slate); padding:6px; border-radius:var(--radius-sm);
    display:inline-flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background:var(--paper-deep); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--red-bg); color:var(--red); }

  label.field-label{ display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate); margin-bottom:6px;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; font-family:inherit; font-size:13.5px; color:var(--ink-text);
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius-sm); padding:9px 11px;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  textarea{ resize:vertical; min-height:76px; line-height:1.5; }
  .field{ margin-bottom:16px; }
  .field-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .field-hint{ font-size:11.5px; color:var(--slate-soft); margin-top:5px; }

  .crit-card{
    border:1px solid var(--rule-soft); border-left:3px solid var(--rule);
    border-radius:12px; padding:14px 16px; margin-bottom:12px; background:var(--card); transition:border-color 0.15s, background 0.15s;
  }
  .crit-card:last-child{ margin-bottom:0; }
  .crit-card[data-band="unscored"]{ border-left-color:var(--rule); }
  .crit-card[data-band="0"]{ border-left-color:var(--red); background:color-mix(in srgb, var(--red-bg) 40%, var(--card)); }
  .crit-card[data-band="1"]{ border-left-color:var(--amber); background:color-mix(in srgb, var(--amber-bg) 40%, var(--card)); }
  .crit-card[data-band="2"]{ border-left-color:var(--green); background:color-mix(in srgb, var(--green-bg) 40%, var(--card)); }
  .crit-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .crit-head .crit-info{ flex:1; min-width:200px; }
  .crit-name{ font-weight:600; color:var(--ink-text); font-size:13.5px; }
  .crit-desc{ font-size:12px; color:var(--slate-soft); margin-top:3px; line-height:1.45; }
  .seg{ display:flex; border:1px solid var(--rule); border-radius:20px; overflow:hidden; background:var(--card); flex-shrink:0; }
  .seg button{
    border:none; background:none; padding:8px 14px; font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; font-weight:600; color:var(--slate); cursor:pointer; border-right:1px solid var(--rule); white-space:nowrap;
  }
  .seg button:last-child{ border-right:none; }
  .seg button.sel-0.active{ background:var(--red-bg); color:var(--red); }
  .seg button.sel-1.active{ background:var(--amber-bg); color:var(--amber-dark,var(--amber)); }
  .seg button.sel-2.active{ background:var(--green-bg); color:var(--green); }
  .crit-note{ margin-top:10px; }
  .crit-note textarea{ min-height:52px; font-size:12.5px; padding:8px 10px; background:var(--card); }
  .crit-note .note-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate-soft); font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
  .crit-note .note-label .req-dot{ width:5px; height:5px; border-radius:50%; background:var(--rule); display:inline-block; }
  .crit-card[data-band="0"] .note-label .req-dot{ background:var(--red); }
  .crit-card[data-band="1"] .note-label .req-dot{ background:var(--amber); }
  .crit-card[data-band="2"] .note-label .req-dot{ background:var(--green); }
  .crit-info-toggle{ background:none; border:none; cursor:pointer; font-family:inherit; font-size:11px; font-weight:600; color:var(--brass); padding:6px 0 0 0; letter-spacing:0.02em; }
  .crit-info-toggle:hover{ color:var(--brass-dark); text-decoration:underline; }
  .crit-info-panel{ display:none; margin-top:8px; background:var(--neutral-bg); border:1px solid var(--rule); border-radius:var(--radius-sm); padding:10px 13px; font-size:11.5px; line-height:1.6; color:var(--neutral-ink); white-space:pre-line; }
  .crit-info-panel.open{ display:block; }
  .prev-reviews{ background:var(--brass-tint); border:1px solid var(--rule); border-radius:var(--radius); padding:14px 18px; margin:18px 0; font-size:13px; }
  .prev-reviews .prev-title{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; font-weight:700; color:var(--brass-dark); margin-bottom:8px; }
  .prev-reviews .prev-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid rgba(0,0,0,0.06); }
  .prev-reviews .prev-item:first-of-type{ border-top:none; }
  .prev-reviews .prev-item .agent-name{ color:var(--slate); }
  .summary-actions{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--paper-deep); border:1px solid var(--rule-soft); border-radius:var(--radius); padding:14px 18px; margin-bottom:18px;
  }
  .summary-actions p{ margin:0; font-size:12.5px; color:var(--slate); max-width:520px; }
  .gen-note{ font-size:11.5px; color:var(--slate-soft); margin-top:8px; }

  .total-strip{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:var(--ink); color:#eafaf5; border-radius:12px; padding:16px 22px; margin:20px 0;
  }
  .total-strip .tlabel{ font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:#9dc3ba;}
  .total-strip .tval{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; }
  .total-strip .tval small{ font-size:14px; font-weight:500; color:#a9d3c9;}

  .letterhead{ border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; background:var(--card); }
  .letterhead .lh-band{ background:var(--ink); color:#eafaf5; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; }
  .letterhead .lh-band h4{ margin:0; font-family:'Inter',serif; font-size:16px; font-weight:700;}
  .letterhead .lh-body{ padding:20px 22px; }
  .kv-table{ width:100%; border-collapse:collapse; }
  .kv-table td{ padding:8px 12px; border:1px solid var(--rule); font-size:13px; }
  .kv-table td.k{ background:var(--paper-deep); font-weight:700; width:210px; text-transform:uppercase; font-size:11px; letter-spacing:0.04em; color:var(--slate); }

  .section-block{ margin-top:18px; }
  .section-block h5{ font-family:'Inter',serif; font-size:14px; margin:0 0 6px 0; color:var(--ink); font-weight:700; border-bottom:1.5px solid var(--brass); padding-bottom:5px; display:inline-block; }
  .section-block p{ margin:8px 0 0 0; color:var(--ink-text); white-space:pre-wrap; }

  .empty-state{ text-align:center; padding:56px 20px; color:var(--slate-soft); }
  .empty-state svg{ opacity:0.5; margin-bottom:12px; }
  .empty-state h4{ font-family:'Inter',serif; color:var(--ink); font-size:17px; margin:0 0 6px 0; }
  .empty-state p{ font-size:13px; margin:0 0 18px 0; }

  .toast-wrap{ position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
  .toast{
    background:var(--ink); color:#eafaf5; padding:12px 18px; border-radius:10px; font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); display:flex; align-items:center; gap:10px; border-left:3px solid var(--brass); animation: slidein 0.25s ease-out;
  }
  @keyframes slidein{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,29,49,0.55); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 20px; z-index:100; overflow-y:auto;
  }
  .modal{ background:var(--paper); border-radius:5px; width:100%; max-width:680px; box-shadow:0 20px 60px rgba(0,0,0,0.35); border:1px solid var(--rule); }
  .modal-head{ padding:18px 24px; border-bottom:1px solid var(--rule); display:flex; align-items:center; justify-content:space-between; }
  .modal-head h3{ font-family:'Inter',serif; margin:0; font-size:18px;}
  .modal-body{ padding:22px 24px; max-height:70vh; overflow-y:auto;}
  .modal-foot{ padding:16px 24px; border-top:1px solid var(--rule); display:flex; justify-content:flex-end; gap:10px;}

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .support-chip{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--rule-soft);
    padding:9px 8px 9px 14px; border-radius:20px; font-size:13px; font-weight:600; box-shadow:var(--shadow);
  }
  .support-chip .initial{
    width:22px;height:22px;border-radius:50%; background:var(--ink); color:#eafaf5; display:flex;
    align-items:center; justify-content:center; font-size:10.5px; font-family:'Inter',serif; font-weight:700;
  }

  .filter-bar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .filter-bar select, .filter-bar input{ width:auto; }

  .count-table th:not(:first-child){ text-align:center; }
  .count-table td.num{ text-align:center; }
  .target-input{
    width:76px !important; text-align:center; padding:6px 4px !important; font-family:'IBM Plex Mono',monospace;
    font-weight:600; display:inline-block;
  }

  .loading-screen{
    position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:999;
  }
  .loading-screen .seal-lg{
    width:52px;height:52px;border-radius:50%; border:2px solid var(--brass); display:flex; align-items:center; justify-content:center;
    font-family:'Inter',serif; font-weight:700; font-size:20px; color:var(--brass); animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:0.4;} }
  .loading-screen p{ color:var(--slate); font-size:13px; letter-spacing:0.04em;}

  ::-webkit-scrollbar{ width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:6px;}
  ::-webkit-scrollbar-track{ background:transparent;}

  @media (max-width: 880px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; align-items:center; overflow-x:auto;}
    .brand{ border-bottom:none; padding:14px 16px;}
    nav.navlist{ display:flex; padding:8px; }
    .sidebar-foot{ display:none; }
    .content{ padding:20px 16px 60px; }
    .topbar{ padding:16px; flex-direction:column; align-items:flex-start; gap:10px;}
    .stat-row{ grid-template-columns:1fr; }
    .field-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div id="loading" class="loading-screen">
  <div class="seal-lg">SP</div>
  <p>Loading Supervisor Workspace…</p>
</div>

<div class="app" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <div class="seal">SP</div>
        <h1>Support Performance</h1>
      </div>
      <div class="tagline">Supervisor Ledger</div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div class="sidebar-foot">
      <div class="save-status" id="saveStatus"><span class="dot"></span><span id="saveStatusText">All changes saved</span></div>
      <div class="month-chip" id="sidebarMonthChip">—</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="sub" id="pageSub">Automatic scoring and monthly averages across the team</div>
      </div>
      <div class="month-select">
        <label>Month</label>
        <select id="globalMonth"></select>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>

<script>
const CRITERIA = [
  { key:'identification', name:'Identification', max:2,

const SYNC_URL_KEY = 'seqas-sync-url';
const DEFAULT_SYNC_URL = 'https://support-performance-ec0a1-default-rtdb.firebaseio.com';
let SYNC_URL = DEFAULT_SYNC_URL;
try{
  const stored = localStorage.getItem(SYNC_URL_KEY);
  SYNC_URL = (stored === null) ? DEFAULT_SYNC_URL : stored;
}catch(e){ SYNC_URL = DEFAULT_SYNC_URL; }
let lastSyncStatus = null;
let lastSyncMessage = '';

function syncEndpoint(){ return SYNC_URL.replace(/\/$/, '') + '/app-data.json'; }
async function pullRemoteState(){
  if(!SYNC_URL) return undefined;
  try{
    const res = await fetch(syncEndpoint(), { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    lastSyncStatus = 'ok';
    return data;
  }catch(e){
    console.error('Sync pull failed', e);
    lastSyncStatus = 'error';
    lastSyncMessage = e && e.message ? e.message : String(e);
    return NaN;
  }
}
async function pushRemoteState(state){
  if(!SYNC_URL) return true;
  try{
    const res = await fetch(syncEndpoint(), {
      method:'PUT',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(state)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    lastSyncStatus = 'ok';
    return true;
  }catch(e){
    console.error('Sync push failed', e);
    lastSyncStatus = 'error';
    lastSyncMessage = e && e.message ? e.message : String(e);
    return false;
  }
}
function mergeArraysById(a, b){
  const map = new Map();
  [...(a||[]), ...(b||[])].forEach(item=>{ if(item && item.id) map.set(item.id, item); });
  return Array.from(map.values());
}
function mergeMaxCounts(a, b){
  const out = { ...(a||{}) };
  Object.keys(b||{}).forEach(k=>{ out[k] = Math.max(out[k]||0, b[k]); });
  return out;
}
function mergeStates(local, remote){
  if(!remote || typeof remote !== 'object') return local;
  const deletedCaseNumbers = Array.from(new Set([...(remote.deletedCaseNumbers||[]), ...(local.deletedCaseNumbers||[])].map(String)));
  const deletedAgentReviewIds = Array.from(new Set([...(remote.deletedAgentReviewIds||[]), ...(local.deletedAgentReviewIds||[])]));
  const merged = {
    supports: mergeArraysById(remote.supports, local.supports),
    targets: { ...(remote.targets||{}), ...(local.targets||{}) },
    records: mergeArraysById(remote.records, local.records).filter(r=>!deletedCaseNumbers.includes(String(r.caseNumber))),
    seededAugust2026: !!(local.seededAugust2026 || remote.seededAugust2026),
    deletedCaseNumbers,
    augustAccuracyApplied: !!(local.augustAccuracyApplied || remote.augustAccuracyApplied),
    agentReviews: mergeArraysById(remote.agentReviews, local.agentReviews).filter(a=>!deletedAgentReviewIds.includes(a.id)),
    deletedAgentReviewIds,
    viewerSupportId: local.viewerSupportId,
    personalTargets: { ...(remote.personalTargets||{}), ...(local.personalTargets||{}) },
    attendance: { ...(remote.attendance||{}), ...(local.attendance||{}) },
    agentReviewDeletionCounts: mergeMaxCounts(remote.agentReviewDeletionCounts, local.agentReviewDeletionCounts),
    agentReviewAugust2026Seeded: !!(local.agentReviewAugust2026Seeded || remote.agentReviewAugust2026Seeded),
    historicalDuplicatesCleaned: !!(local.historicalDuplicatesCleaned || remote.historicalDuplicatesCleaned),
  };
  return reconcileState(merged);
}
function dedupeSupports(state){
  const groups = new Map();
  (state.supports||[]).forEach(s=>{
    const key = (s.name||'').trim().toLowerCase();
    if(!key) return;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  });
  const remap = {};
  const cleaned = [];
  groups.forEach(list=>{
    if(list.length === 1){ cleaned.push(list[0]); return; }
    const scored = list.map(s=>({
      s,
      score: (state.records||[]).filter(r=>r.supportId===s.id).length + (state.agentReviews||[]).filter(a=>a.supportId===s.id).length
    })).sort((a,b)=>b.score-a.score);
    const canonical = scored[0].s;
    cleaned.push(canonical);
    list.forEach(s=>{ if(s.id!==canonical.id) remap[s.id] = canonical.id; });
  });
  if(Object.keys(remap).length === 0) return state;
  const remapId = id => remap[id] || id;
  state.supports = cleaned;
  (state.records||[]).forEach(r=>{ r.supportId = remapId(r.supportId); });
  (state.agentReviews||[]).forEach(a=>{ a.supportId = remapId(a.supportId); });
  ['personalTargets','attendance'].forEach(field=>{
    const out = {};
    Object.entries(state[field]||{}).forEach(([key,val])=>{
      const idx = key.indexOf(':');
      const sid = idx===-1 ? key : key.slice(0,idx);
      const rest = idx===-1 ? '' : key.slice(idx);
      const newKey = remapId(sid) + rest;
      if(!(newKey in out)) out[newKey] = val;
    });
    state[field] = out;
  });
  const remappedCounts = {};
  Object.entries(state.agentReviewDeletionCounts||{}).forEach(([sid,val])=>{
    const nid = remapId(sid);
    remappedCounts[nid] = Math.max(remappedCounts[nid]||0, val);
  });
  state.agentReviewDeletionCounts = remappedCounts;
  if(state.viewerSupportId) state.viewerSupportId = remapId(state.viewerSupportId);
  return state;
}
function completenessScore(obj, fields){
  return fields.reduce((s,f)=> s + (obj[f] ? String(obj[f]).trim().length : 0), 0);
}
function dedupeByKey(list, keyFn, fields){
  const groups = new Map();
  const noKey = [];
  (list||[]).forEach(item=>{
    const k = keyFn(item);
    if(k===null || k===undefined || k===''){ noKey.push(item); return; }
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(item);
  });
  const result = [...noKey];
  groups.forEach(g=>{
    if(g.length === 1){ result.push(g[0]); return; }
    g.sort((a,b)=> completenessScore(b,fields)-completenessScore(a,fields) || (b.createdAt||0)-(a.createdAt||0));
    result.push(g[0]);
  });
  return result;
}
function reconcileState(state){
  state = dedupeSupports(state);
  if(!state.historicalDuplicatesCleaned){
    state.records = dedupeByKey(state.records, r=>String(r.caseNumber||'').trim(), ['supportAction','commitmentObservations','additionalActions','tlCommitment']);
    state.agentReviews = dedupeByKey(state.agentReviews, a=> a.caseNumber ? `${a.mode}:${String(a.caseNumber).trim()}` : null, ['agentName','category','section1']);
    state.historicalDuplicatesCleaned = true;
  }
  return state;
}
async function syncNow(){
  if(!SYNC_URL) return;
  const remote = await pullRemoteState();
  if(remote === undefined) return;
  if(Number.isNaN(remote)){
    setSaveStatus('error', 'Sync failed — tap to retry');
    return;
  }
  STATE = mergeStates(STATE, remote);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
  const pushOk = await pushRemoteState(STATE);
  const stamp = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  if(pushOk) setSaveStatus(null, `Synced at ${stamp}`);
  else setSaveStatus('error', 'Sync failed — tap to retry');
}

async function loadState(){
  if(!isStorageReady()) return false;
  let raw;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ return false; }
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      STATE.supports = parsed.supports || [];
      STATE.targets = parsed.targets || {};
      STATE.records = parsed.records || [];
      STATE.seededAugust2026 = !!parsed.seededAugust2026;
      STATE.deletedCaseNumbers = parsed.deletedCaseNumbers || [];
      STATE.augustAccuracyApplied = !!parsed.augustAccuracyApplied;
      STATE.agentReviews = parsed.agentReviews || [];
      STATE.viewerSupportId = parsed.viewerSupportId || null;
      STATE.personalTargets = parsed.personalTargets || {};
      STATE.attendance = parsed.attendance || {};
      STATE.agentReviewDeletionCounts = parsed.agentReviewDeletionCounts || {};
      STATE.agentReviewAugust2026Seeded = !!parsed.agentReviewAugust2026Seeded;
      STATE.historicalDuplicatesCleaned = !!parsed.historicalDuplicatesCleaned;
      STATE.deletedAgentReviewIds = parsed.deletedAgentReviewIds || [];
      STATE = reconcileState(STATE);
      if(SYNC_URL){
        const remote = await pullRemoteState();
        if(remote !== undefined && !Number.isNaN(remote)){
          STATE = mergeStates(STATE, remote);
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
        }
      }
      setSaveStatus(null, 'All changes saved');
      return true;
    }catch(e){ return false; }
  }
  return true;
}

let hasUnsavedFailure = false;
async function saveState(){
  setSaveStatus('saving', 'Saving…');
  try{
    if(!isStorageReady()) throw new Error('localStorage is blocked or unavailable in this browser.');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    hasUnsavedFailure = false;
    let syncFailed = false;
    if(SYNC_URL){
      const remote = await pullRemoteState();
      if(remote !== undefined && !Number.isNaN(remote)){
        STATE = mergeStates(STATE, remote);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      } else if(Number.isNaN(remote)){
        syncFailed = true;
      }
      const pushOk = await pushRemoteState(STATE);
      if(!pushOk) syncFailed = true;
    }
    const stamp = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    if(SYNC_URL && syncFailed){
      setSaveStatus('error', 'Saved on this device — sync failed, tap to retry');
      toastRetry('Saved here, but couldn\u2019t reach the shared database. Tap to retry syncing.');
    } else {
      setSaveStatus(null, SYNC_URL ? `Synced at ${stamp}` : `Saved at ${stamp}`);
    }
    return true;
  }catch(e){
    hasUnsavedFailure = true;
    setSaveStatus('error', 'Not saved — tap to retry');
    toastRetry('Could not save your last change. Tap here to try again.');
    return false;
  }
}

function avgPercent(recs){
  if(!recs.length) return null;
  return recs.reduce((s,r)=>s+r.percent,0)/recs.length;
}
function sortedSupports(){
  return [...STATE.supports].sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:'base'}));

function getTarget(month){
  if(STATE.targets[month] !== undefined) return STATE.targets[month];
  return 16;
}
function personalTargetKey(supportId, month){ return `${supportId}:${month}`; }
function getPersonalTarget(supportId, month){
  const key = personalTargetKey(supportId, month);
  if(STATE.personalTargets[key] !== undefined && STATE.personalTargets[key] !== null && STATE.personalTargets[key] !== '') return Number(STATE.personalTargets[key]);
  return null;
}
function getAttendance(supportId, month){
  const key = personalTargetKey(supportId, month);
  return STATE.attendance[key] || { absent:0, vl:0, ml:0, el:0 };
}
function getWorkingDaysInMonth(month){
  const [y,m] = month.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  let count = 0;
  for(let d=1; d<=daysInMonth; d++){
    const day = new Date(y, m-1, d).getDay();
    if(day !== 0 && day !== 6) count++;
  }
  return count;
}
function getAdjustedTarget(supportId, month){
  const base = getPersonalTarget(supportId, month);
  if(base===null) return null;
  const att = getAttendance(supportId, month);
  const leaveDays = (Number(att.absent)||0) + (Number(att.vl)||0) + (Number(att.ml)||0) + (Number(att.el)||0);
  const workingDays = getWorkingDaysInMonth(month);
  if(leaveDays<=0 || workingDays<=0) return base;
  const factor = Math.max(0, (workingDays - leaveDays) / workingDays);
  return Math.max(0, Math.round(base * factor));
}
function scoreBadgeClass(pct){
  if(pct===null || pct===undefined) return 'neutral';
  if(pct>=0.85) return 'green';
  if(pct>=0.70) return 'amber';
  return 'red';
}
function pctStr(p){ return p===null||p===undefined ? '—' : Math.round(p*100)+'%'; }
function notePlaceholder(c, val){
  if(val===0) return `What was missed or done incorrectly for ${c.name.toLowerCase()}?`;
  if(val===1) return `What was partially done, and what's still missing?`;
  if(val===c.max) return `What did support do well here?`;
  return `Score this criterion first, then explain why.`;
}
function buildSummary(scores, notes){
  const notMet=[], partial=[], met=[];
  CRITERIA.forEach(c=>{
    const val = scores[c.key];
    const note = (notes[c.key]||'').trim();
    const entry = { name:c.name, note, val };
    if(val===0) notMet.push(entry);
    else if(val===c.max) met.push(entry);
    else partial.push(entry);
  });
  const gaps = [...notMet, ...partial];
  const lower = s=>s.charAt(0).toLowerCase()+s.slice(1);
  const list = arr => arr.length<=1 ? (arr[0]||'') : arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1];
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];

  if(!met.length && !gaps.length){
    return { supportAction:'Score each criterion above, then generate the summary.', commitment:'', additional:'', tlNotes:'' };
  }

  const saParts = [];
  if(met.length){
    saParts.push(pick([
      `Support ${gaps.length?'demonstrated good':'demonstrated strong'} reasoning by handling ${list(met.map(m=>lower(m.name)))} well on this case.`,
      `Support showed solid, confident work in ${list(met.map(m=>lower(m.name)))} throughout this interaction.`,
      `This case highlighted real strength in ${list(met.map(m=>lower(m.name)))}.`,
      `Support brought good instincts to ${list(met.map(m=>lower(m.name)))} here.`,
    ]));
    met.filter(m=>m.note).forEach(m=>saParts.push(m.note));
  }
  if(gaps.length){
    saParts.push(pick([
      met.length ? `${pick(['That said','On the other hand','Alongside that'])}, there ${gaps.length>1?'were':'was'} a few spots to build on around ${list(gaps.map(g=>lower(g.name)))}.`
                 : `There ${gaps.length>1?'were':'was'} a few spots to build on around ${list(gaps.map(g=>lower(g.name)))}.`,
      met.length ? `The main opportunity here is around ${list(gaps.map(g=>lower(g.name)))}.`
                 : `The main opportunity in this case is around ${list(gaps.map(g=>lower(g.name)))}.`,
    ]));
    gaps.forEach(g=>{ if(g.note) saParts.push(g.note); });
  }
  const supportAction = saParts.join(' ');

  const cParts = [];
  if(met.length){
    cParts.push(pick([
      `Support showed good ownership here, staying engaged and handling ${list(met.map(m=>lower(m.name)))} the right way.`,
      `There was strong follow-through in this case, particularly in ${list(met.map(m=>lower(m.name)))}.`,
      `Support stayed on top of ${list(met.map(m=>lower(m.name)))}, which reflects well on how this case was handled.`,
    ]));
  }
  if(gaps.length){
    let p2 = pick([
      `However, there was an opportunity to strengthen ${list(gaps.map(g=>lower(g.name)))}.`,
      `That said, ${list(gaps.map(g=>lower(g.name)))} is worth a closer look going forward.`,
      `Looking ahead, ${list(gaps.map(g=>lower(g.name)))} is where the next bit of growth can happen.`,
    ]);
    const notedGaps = gaps.filter(g=>g.note).map(g=>g.note);
    if(notedGaps.length) p2 += ' ' + notedGaps.join(' ');
    p2 += ' ' + pick([
      `This is a good chance to build a stronger habit here for next time.`,
      `Keeping an eye on this on the next few cases should help it stick.`,
      `Nothing dramatic \u2014 just something worth being a little more deliberate about going forward.`,
    ]);
    cParts.push(p2);
  } else {
    cParts.push(`Nothing else to flag here \u2014 the goal now is just to keep this same level of consistency going.`);
  }
  const commitment = cParts.join('\n\n');

  let additional;
  if(!gaps.length){
    additional = pick([
      'Nothing extra needed here \u2014 everything in this case was handled the right way.',
      'No additional actions to flag. This is a good one to hold up as an example.',
    ]);
  } else {
    additional = gaps.map(g=>{
      const base = g.note ? g.note : `Take a closer look at ${lower(g.name)} on the next similar case.`;
      return `* ${base}`;
    }).join('\n\n');
  }

  const tParts = [];
  if(gaps.length){
    tParts.push(pick([
      `I'll walk through ${list(gaps.map(g=>lower(g.name)))} with support directly, using this case as a real, concrete example rather than a hypothetical.`,
      `I'll sit down with support and go over ${list(gaps.map(g=>lower(g.name)))} together, so the expectation is clear for next time.`,
      `I'll take a few minutes with support to talk through ${list(gaps.map(g=>lower(g.name)))}, framing it as a growth area rather than a miss.`,
    ]));
    tParts.push(pick([
      `We'll go over what good looks like here, and I'll check in on the next couple of cases to see how it's landing.`,
      `The goal is just to build the habit \u2014 I'll keep an eye on upcoming cases and follow up if it's needed.`,
      `I want this to feel like coaching, not criticism, so I'll frame it around what support can add next time, not what went wrong this time.`,
    ]));
    if(met.length){
      tParts.push(pick([
        `I'll also make a point of recognizing the strong work in ${list(met.map(m=>lower(m.name)))}, since that's worth reinforcing.`,
        `Worth calling out too: ${list(met.map(m=>lower(m.name)))} was handled well, and I want support to know that landed.`,
      ]));
    }
  } else {
    tParts.push(pick([
      `Nothing to coach here \u2014 I'll make sure support hears that this case reflects the standard we want to see more of.`,
      `No coaching needed this time. I'll recognize the consistent work and use this as a positive example for the team.`,
    ]));
  }
  const tlNotes = tParts.join(' ');

  return { supportAction: supportAction.trim(), commitment: commitment.trim(), additional: additional.trim(), tlNotes: tlNotes.trim() };
}

function toast(msg, isError){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.borderLeftColor = 'var(--red)';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function toastRetry(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.borderLeftColor = 'var(--red)';
  el.style.cursor = 'pointer';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  el.addEventListener('click', ()=>{ el.remove(); saveState(); });
  wrap.appendChild(el);
  setTimeout(()=>{ if(el.isConnected){ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); } }, 6000);
}

  new: ['New Feedback', 'Score a SEQAS evaluation and capture coaching notes'],
  records: ['Records', 'Every evaluation on file, filterable by month and support'],
  supports: ['Manage Supports', 'Add or remove people from the active roster'],
  agentReviews: ['Agent Review', 'Log commendations and feedback from agents you\u2019ve helped'],
};

function setView(view, opts={}){
  currentView = view;
  if(!opts.keepEditing) editingRecordId = null;
  renderNav();
  const meta = PAGE_META[view];
  document.getElementById('pageTitle').textContent = meta[0];
  document.getElementById('pageSub').textContent = meta[1];
  render();
}

function populateGlobalMonth(){
  const sel = document.getElementById('globalMonth');
  const months = allMonthsUsed();
  sel.innerHTML = months.map(m=>`<option value="${m}" ${m===currentMonth?'selected':''}>${monthLabel(m)}</option>`).join('');
  document.getElementById('sidebarMonthChip').textContent = monthLabel(currentMonth);
}

const NAV_SUPERVISOR = [
  { group:'Overview', items:[
    { view:'dashboard', label:'Dashboard', icon:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>' },
    { view:'counts', label:'Review Count & Target', icon:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>' },
  ]},
  { group:'Evaluations', items:[
    { view:'new', label:'New Feedback', icon:'<path d="M12 5v14M5 12h14"/>' },
    { view:'records', label:'Records', icon:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>' },
  ]},
  { group:'Feedback', items:[
    { view:'agentReviews', label:'Agent Reviews', icon:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>' },
  ]},
  { group:'Admin', items:[
    { view:'supports', label:'Manage Supports', icon:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>' },
  ]},
];

function renderNav(){
  const nav = document.getElementById('navlist');
  nav.innerHTML = NAV_SUPERVISOR.map(g=>`
    <div class="navgroup-label">${esc(g.group)}</div>
    ${g.items.map(item=>`<button data-view="${item.view}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${item.icon}</svg>${esc(item.label)}</button>`).join('')}
  `).join('');
  nav.querySelectorAll('button[data-view]').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===currentView);
    b.addEventListener('click', ()=>setView(b.dataset.view));
  });
}

function render(){
  populateGlobalMonth();
  const c = document.getElementById('content');
  if(currentView==='dashboard') c.innerHTML = renderDashboard();
  else if(currentView==='counts') c.innerHTML = renderCounts();
  else if(currentView==='new') c.innerHTML = renderNewFeedback();
  else if(currentView==='records') c.innerHTML = renderRecords();
  else if(currentView==='supports') c.innerHTML = renderSupports();
  else if(currentView==='agentReviews') c.innerHTML = renderAgentReviews();
  attachViewHandlers();
}

function renderDashboard(){
  const months = allMonthsUsed();
  const thisMonthRecs = recordsFor(currentMonth);
  const target = getTarget(currentMonth);

  const seqasReviewedCount = thisMonthRecs.length;
  const seqasTargetStr = `${seqasReviewedCount}/${target}`;
  const seqasRawRate = target > 0 ? seqasReviewedCount / target : null;
  const seqasCompletionRate = seqasRawRate === null ? null : Math.min(1, seqasRawRate);

  const thisMonthAgentReviews = STATE.agentReviews.filter(a => (a.date || '').slice(0,7) === currentMonth);
  let totalAgentProgressSum = 0;
  let supportsCount = STATE.supports.length;

  if (supportsCount > 0) {
    STATE.supports.forEach(s => {
      const adjTarget = getAdjustedTarget(s.id, currentMonth);
      const sReviewsCount = thisMonthAgentReviews.filter(a => a.supportId === s.id).length;
      if (adjTarget !== null && adjTarget > 0) {
        totalAgentProgressSum += Math.min(1, sReviewsCount / adjTarget);
      } else if (target > 0) {
        totalAgentProgressSum += Math.min(1, sReviewsCount / target);
      }
    });
  }
  const avgAgentReviewProgress = supportsCount > 0 ? Math.min(1, totalAgentProgressSum / supportsCount) : null;
  const teamMonthAvg = avgPercent(thisMonthRecs);

  const rows = sortedSupports().map(sup=>{
    const cells = months.map(m=>{
      const recs = recordsFor(m, sup.id);
      const avg = avgPercent(recs);
      if(!recs.length) return `<td class="num" style="color:var(--slate-soft);">—</td>`;
      return `<td class="num"><span class="badge ${scoreBadgeClass(avg)}">${pctStr(avg)}</span> <span style="color:var(--slate-soft); font-size:11px;">(${recs.length})</span></td>`;
    }).join('');
    const supAll = recordsFor(null, sup.id).length ? STATE.records.filter(r=>r.supportId===sup.id) : [];
    const overallAvg = avgPercent(supAll);
    return `<tr><td style="font-weight:600;">${esc(sup.name)}</td>${cells}<td class="num"><span class="badge ${scoreBadgeClass(overallAvg)}">${pctStr(overallAvg)}</span></td></tr>`;
  }).join('');

  const teamOverallAvg = avgPercent(STATE.records);

  const bySupportRows = sortedSupports().map(s=>{
    const mine = STATE.agentReviews.filter(a=>a.supportId===s.id);
    const rc = mine.filter(a=>a.mode==='review').length;
    const cc = mine.filter(a=>a.mode==='commendation').length;
    const monthCount = mine.filter(a=>a.date && a.date.slice(0,7)===currentMonth).length;
    const adjusted = getAdjustedTarget(s.id, currentMonth);
    const rate = (adjusted!==null && adjusted>0) ? Math.min(1, monthCount/adjusted) : (target>0 ? Math.min(1, monthCount/target) : null);
    return `<tr>
      <td style="font-weight:600;">${esc(s.name)}</td>
      <td class="num">${rc}</td>
      <td class="num">${cc}</td>
      <td class="num">${rc+cc}</td>
      <td class="num">${rate===null ? '<span style="color:var(--slate-soft);">No target set</span>' : `<span class="badge ${rate>=1?'green':'neutral'}">${Math.round(rate*100)}%</span>`}</td>
    </tr>`;
  }).join('');

  return `
  <div class="stat-row" style="grid-template-columns: repeat(2, 1fr);">
    <div class="stat-card">
      <div class="label">${monthLabel(currentMonth)} SEQAS Review</div>
      <div class="value" style="font-size:36px; font-weight:800; color:var(--ink);">
        ${seqasCompletionRate === null ? '—' : Math.round(seqasCompletionRate * 100) + '%'}
      </div>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:700; color:var(--slate); margin-top:4px;">
        ${seqasTargetStr}
      </div>
      <div class="delta" style="margin-top:4px;">
        <span class="badge ${seqasCompletionRate >= 1 ? 'green' : (seqasCompletionRate > 0 ? 'amber' : 'neutral')}">
          ${seqasReviewedCount} of ${target} evaluations completed
        </span>
      </div>
    </div>

    <div class="stat-card">
      <div class="label">Agent Reviews Completion Average</div>
      <div class="value" style="font-size:36px; font-weight:800; color:var(--brass-dark);">
        ${avgAgentReviewProgress === null ? '—' : Math.round(avgAgentReviewProgress * 100) + '%'}
      </div>
      <div style="font-size:14px; font-weight:600; color:var(--slate); margin-top:6px;">
        ${thisMonthAgentReviews.length} total entries logged this month
      </div>
      <div class="delta" style="margin-top:4px;">
        <span class="badge ${avgAgentReviewProgress >= 1 ? 'green' : 'neutral'}">Averages everyone's monthly progress</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div>
        <h3>Seqas review Score Summary</h3>
        <div style="font-size:11.5px; color:var(--slate-soft); margin-top:2px;">
          ${monthLabel(currentMonth)} Average Score: <strong>${pctStr(teamMonthAvg)}</strong> (${thisMonthRecs.length} review${thisMonthRecs.length===1?'':'s'}) &middot; Overall Average: <strong>${pctStr(teamOverallAvg)}</strong>
        </div>
      </div>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table>
        <thead><tr><th>Support</th>${months.map(m=>`<th>${monthLabel(m).slice(0,3).toUpperCase()} '${m.slice(2,4)}</th>`).join('')}<th>Overall</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab to begin scoring.', 'supports','Add supports')}
    </div>
  </div>

  <div class="card" style="margin-top:20px;">
    <div class="card-header">
      <h3>Support Agent Review</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">Reviews and commendations submitted by each support for ${monthLabel(currentMonth)}</span>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table>
        <thead><tr><th>Support</th><th>Reviews</th><th>Commendations</th><th>Total</th><th>Progress</th></tr></thead>
        <tbody>${bySupportRows}</tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab.', 'supports','Add supports')}
    </div>
  </div>
  `;
}

function renderCounts(){
  const thisMonthRecs = recordsFor(currentMonth);
  const target = getTarget(currentMonth);
  const rate = target > 0 ? Math.min(1, thisMonthRecs.length / target) : null;

  const rows = sortedSupports().map(sup=>{
    const recCount = recordsFor(currentMonth, sup.id).length;
    return `<tr>
      <td style="font-weight:600;">${esc(sup.name)}</td>
      <td class="num">${recCount || '<span style="color:var(--slate-soft);">0</span>'}</td>
    </tr>`;
  }).join('');

  const personalTargetRows = sortedSupports().map(sup=>{
    const key = personalTargetKey(sup.id, currentMonth);
    const stored = STATE.personalTargets[key];
    const val = (stored===undefined||stored===null||stored==='') ? '' : stored;
    return `<tr>
      <td style="font-weight:600;">${esc(sup.name)}</td>
      <td class="num"><input type="number" min="0" class="target-input" placeholder="\u2014" data-personal-target-support="${sup.id}" data-personal-target-month="${currentMonth}" value="${val}"></td>
    </tr>`;
  }).join('');

  const attendanceRows = sortedSupports().map(sup=>{
    const att = getAttendance(sup.id, currentMonth);
    const total = (Number(att.absent)||0)+(Number(att.vl)||0)+(Number(att.ml)||0)+(Number(att.el)||0);
    return `<tr>
      <td style="font-weight:600;">${esc(sup.name)}</td>
      <td class="num">${total ? `A:${att.absent||0} VL:${att.vl||0} ML:${att.ml||0} EL:${att.el||0}` : '<span style="color:var(--slate-soft);">\u2014</span>'}</td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <div class="card-header">
      <h3>Review Count by Support</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">Evaluations logged for ${monthLabel(currentMonth)}</span>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table class="count-table">
        <thead><tr><th>Support</th><th>${monthShort(currentMonth)}</th></tr></thead>
        <tbody>${rows}</tbody>
        <tbody>
          <tr class="row-total"><td>Total</td><td class="num">${thisMonthRecs.length}</td></tr>
          <tr><td style="font-weight:600;">Target <span style="font-weight:400; color:var(--slate-soft); font-size:11px;">(editable)</span></td><td class="num"><input type="number" min="0" class="target-input" data-target-month="${currentMonth}" value="${target}"></td></tr>
          <tr><td style="font-weight:600;">Rate</td><td class="num"><span class="badge ${rate===null?'neutral':(rate>=1?'green':'red')}">${rate===null?'—':Math.round(rate*100)+'%'}</span></td></tr>
        </tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab to begin tracking.', 'supports','Add supports')}
    </div>
  </div>
  <p class="field-hint" style="margin-top:14px;">Select any month from the top right to switch and set that month's target. Changes save automatically.</p>

  <div class="card" style="margin-top:20px;">
    <div class="card-header">
      <h3>Personal Targets (${monthLabel(currentMonth)})</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">Set monthly Agent Review goal for ${monthLabel(currentMonth)} \u2014 synced to Support View</span>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table class="count-table">
        <thead><tr><th>Support</th><th>Target Goal</th></tr></thead>
        <tbody>${personalTargetRows}</tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab to begin tracking.', 'supports','Add supports')}
    </div>
  </div>

  <div class="card" style="margin-top:20px;">
    <div class="card-header">
      <h3>Attendance on File (${monthLabel(currentMonth)})</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">Read-only \u2014 supports log this from their own dashboard</span>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table class="count-table">
        <thead><tr><th>Support</th><th>Recorded Leaves</th></tr></thead>
        <tbody>${attendanceRows}</tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab to begin tracking.', 'supports','Add supports')}
    </div>
  </div>
  `;
}

function renderNewFeedback(){
  const editing = editingRecordId ? STATE.records.find(r=>r.id===editingRecordId) : null;
  const scores = editing ? editing.scores : {};
  const supOptions = sortedSupports().map(s=>`<option value="${s.id}" ${editing && editing.supportId===s.id ? 'selected':''}>${esc(s.name)}</option>`).join('');

  if(!STATE.supports.length){
    return emptyState('Add a support first', 'You need at least one support on the roster before logging an evaluation.', 'supports', 'Go to Manage Supports');
  }

  const notes = editing ? (editing.criteriaNotes || {}) : {};
  const scoreRows = CRITERIA.map(c=>{
    const val = scores[c.key];
    const options = c.max===1 ? [0,1] : [0,1,2];
    const optLabels = c.max===1 ? ['Not Met','Met'] : ['Not Met','Partial','Met'];
    const segButtons = options.map((o,i)=>`<button type="button" class="sel-${o} ${val===o?'active':''}" data-score-key="${c.key}" data-score-val="${o}">${optLabels[i]}</button>`).join('');
    const band = val===undefined ? 'unscored' : String(val);
    const noteVal = notes[c.key] || '';
    return `
    <div class="crit-card" data-band="${band}" data-crit-key="${c.key}">
      <div class="crit-head">
        <div class="crit-info">
          <div class="crit-name">${esc(c.name)}</div>
          <div class="crit-desc">${esc(c.desc)}</div>
        </div>
        <div class="seg">${segButtons}</div>
      </div>
      <div class="crit-note">
        <div class="note-label"><span class="req-dot"></span>Why this rating?</div>
        <textarea data-note-key="${c.key}" placeholder="${notePlaceholder(c, val)}">${esc(noteVal)}</textarea>
      </div>
      <button type="button" class="crit-info-toggle" data-crit-toggle="${c.key}">View full criteria \u25BE</button>
      <div class="crit-info-panel" id="critInfo-${c.key}">${esc(c.details)}</div>
    </div>`;
  }).join('');

  return `
  <form id="feedbackForm">
    <div class="card">
      <div class="card-header"><h3>${editing?'Edit':'New'} Evaluation</h3><span style="font-size:11.5px; color:var(--slate-soft);">${monthLabel(currentMonth)}</span></div>
      <div class="card-body">
        <div class="field-grid">
          <div class="field">
            <label class="field-label">Support</label>
            <select id="f_support" required>${supOptions}</select>
          </div>
          <div class="field">
            <label class="field-label">Month</label>
            <input type="month" id="f_month" value="${editing?editing.month:currentMonth}" required>
          </div>
          <div class="field">
            <label class="field-label">Date of Evaluation</label>
            <input type="date" id="f_evalDate" value="${editing?editing.dateOfEval:''}" required>
          </div>
          <div class="field">
            <label class="field-label">Chat Date</label>
            <input type="date" id="f_chatDate" value="${editing?editing.chatDate:''}" required>
          </div>
          <div class="field">
            <label class="field-label">Agent Name</label>
            <input type="text" id="f_agent" placeholder="e.g. Maria Fernandez" value="${editing?esc(editing.agentName):''}" required>
          </div>
          <div class="field">
            <label class="field-label">Case Number</label>
            <input type="text" id="f_case" placeholder="e.g. 13587296" value="${editing?esc(editing.caseNumber):''}" required>
          </div>
        </div>
      </div>
    </div>

    <div id="previousReviewsPanel"></div>

    <div class="card" style="margin-top:20px;">
      <div class="card-header"><h3>Scoring</h3><span style="font-size:11.5px; color:var(--slate-soft);">Out of ${MAX_SCORE} points</span></div>
      <div class="card-body" id="scoreArea">${scoreRows}</div>
      <div style="padding:0 20px 20px 20px;">
        <div class="total-strip">
          <div><div class="tlabel">Total Score</div><div class="tval" id="liveTotal">${editing?editing.total:0} <small>/ ${MAX_SCORE}</small></div></div>
          <div><div class="tlabel">Review Score</div><div class="tval" id="livePercent">${editing?pctStr(editing.percent):'0%'}</div></div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:20px;">
      <div class="card-header"><h3>Coaching Notes</h3><span style="font-size:11.5px; color:var(--slate-soft);">Included in the export</span></div>
      <div class="card-body">
        <div class="summary-actions">
          <p>Add a note under each criterion above, then generate a first draft of the four sections below from those notes.</p>
          <button type="button" class="btn brass sm" id="generateSummaryBtn">Generate Summary</button>
        </div>
        <div class="field">
          <label class="field-label">Support Action</label>
          <textarea id="f_supportAction" placeholder="What did support do well or miss during troubleshooting?">${editing?esc(editing.supportAction):''}</textarea>
        </div>
        <div class="field">
          <label class="field-label">Commitment Met / Observations</label>
          <textarea id="f_commitment" placeholder="What will support commit to going forward?">${editing?esc(editing.commitmentObservations):''}</textarea>
        </div>
        <div class="field">
          <label class="field-label">Additional Actions That Could Be Performed</label>
          <textarea id="f_additional" placeholder="Specific steps that could have been taken">${editing?esc(editing.additionalActions):''}</textarea>
        </div>
        <div class="field" style="margin-bottom:8px;">
          <label class="field-label">TL Commitment and Coaching Notes</label>
          <textarea id="f_tlNotes" placeholder="How will the team lead reinforce this going forward?">${editing?esc(editing.tlCommitment):''}</textarea>
        </div>
        <div class="gen-note">Generated text is a starting draft \u2014 edit any field above before saving.</div>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:22px;">
      <button type="submit" class="btn brass">${editing?'Save Changes':'Save Evaluation'}</button>
      ${editing?'<button type="button" class="btn ghost" id="cancelEdit">Cancel</button>':''}
    </div>
  </form>
  `;
}

function renderRecords(){
  const monthFilterOptions = allMonthsUsed().map(m=>`<option value="${m}" ${m===currentMonth?'selected':''}>${monthLabel(m)}</option>`).join('');
  const supFilterOptions = sortedSupports().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');

  return `
  <div class="filter-bar">
    <select id="filterMonth"><option value="">All months</option>${monthFilterOptions}</select>
    <select id="filterSupport"><option value="">All supports</option>${supFilterOptions}</select>
  </div>
  <div class="card">
    <div class="card-body" id="recordsTableWrap" style="overflow-x:auto;"></div>
  </div>
  `;
}

function renderRecordsTable(){
  const monthF = document.getElementById('filterMonth')?.value || '';
  const supF = document.getElementById('filterSupport')?.value || '';
  let recs = STATE.records.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(monthF) recs = recs.filter(r=>r.month===monthF);
  if(supF) recs = recs.filter(r=>r.supportId===supF);

  const wrap = document.getElementById('recordsTableWrap');
  if(!wrap) return;
  if(!recs.length){
    wrap.innerHTML = emptyState('No evaluations found', 'Try a different filter, or log your first evaluation.', 'new', 'New Feedback');
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Support</th><th>Agent</th><th>Case #</th><th>Score</th><th style="text-align:right;">Actions</th></tr></thead>
      <tbody>
        ${recs.map(r=>`
          <tr>
            <td class="num">${fmtDate(r.dateOfEval)}</td>
            <td style="font-weight:600;">${esc(r.supportName)}</td>
            <td class="agent-name">${esc(r.agentName)}</td>
            <td class="num">${esc(r.caseNumber)}</td>
            <td><span class="badge ${scoreBadgeClass(r.percent)}">${r.total}/${MAX_SCORE} &middot; ${pctStr(r.percent)}</span></td>
            <td style="text-align:right; white-space:nowrap;">
              <button class="icon-btn" title="Export" data-export="${r.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3M6 9l6 6 6-6"/><path d="M4 17v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></button>
              <button class="icon-btn" title="Edit" data-edit="${r.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
              <button class="icon-btn danger" title="Delete" data-delete="${r.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll('[data-export]').forEach(b=>b.addEventListener('click', ()=>openExportModal(b.dataset.export)));
  wrap.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{ editingRecordId=b.dataset.edit; setView('new', {keepEditing:true}); }));
  wrap.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click', ()=>confirmDeleteRecord(b.dataset.delete)));
}

function renderSupports(){
  const chips = sortedSupports().map(s=>{

    <select id="arFilterSupport"><option value="">All supports</option>${supFilterOptions}</select>

function renderAllAgentReviewsTable(){
  const wrap = document.getElementById('allAgentReviewsWrap');
  if(!wrap) return;
  const supF = document.getElementById('arFilterSupport')?.value || '';
  const kindF = document.getElementById('arFilterKind')?.value || '';
  let entries = STATE.agentReviews.filter(a=>(a.date||'').slice(0,7)===currentMonth).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const chip = document.getElementById('ar_countChipAll');
  if(chip){
    const rc = entries.filter(a=>a.mode==='review').length;
    const cc = entries.filter(a=>a.mode==='commendation').length;
    chip.textContent = `${rc} review${rc===1?'':'s'} \u00b7 ${cc} commendation${cc===1?'':'s'} for ${monthLabel(currentMonth)}`;
  }
  if(supF) entries = entries.filter(a=>a.supportId===supF);
  if(kindF) entries = entries.filter(a=>a.mode===kindF);
  if(!entries.length){
    wrap.innerHTML = emptyState('No agent review entries found for ' + monthLabel(currentMonth), 'Try selecting a different month from the top right.', null, null);
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Date</th><th>Support</th><th>Agent</th><th>Case #</th><th>Entry</th><th>Category</th><th>Summary</th><th style="text-align:right;">Actions</th></tr></thead>
      <tbody>
        ${entries.map(a=>`
          <tr>
            <td class="num">${fmtDate(a.date)}</td>
            <td style="font-weight:600;">${esc(a.supportName)}</td>
            <td class="agent-name">${esc(a.agentName)||'\u2014'}</td>
            <td class="num">${esc(a.caseNumber)||'\u2014'}</td>
            <td><span class="type-badge ${a.mode==='commendation'?'commendation':''}">${a.mode==='commendation'?'Commendation':'Review'}</span></td>
            <td>${esc(a.category)||'\u2014'}</td>
            <td style="max-width:280px;">${esc((a.section1||'').slice(0,90))}${(a.section1||'').length>90?'\u2026':''}</td>
            <td style="text-align:right; white-space:nowrap;">

function attachViewHandlers(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click', ()=>setView(b.dataset.goto)));

  if(currentView==='counts'){
    document.querySelectorAll('[data-target-month]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const m = inp.dataset.targetMonth;
        const v = Math.max(0, parseInt(inp.value)||0);
        STATE.targets[m] = v;
        await saveState();
        render();
        toast('Target updated');
      });
    });
    document.querySelectorAll('[data-personal-target-support]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const supId = inp.dataset.personalTargetSupport;
        const m = inp.dataset.personalTargetMonth;
        const key = personalTargetKey(supId, m);
        if(inp.value === ''){ delete STATE.personalTargets[key]; }
        else { STATE.personalTargets[key] = Math.max(0, parseInt(inp.value)||0); }
        await saveState();
        toast('Personal target updated');
      });
    });
  }

  if(currentView==='new'){
    const existing = editingRecordId ? STATE.records.find(r=>r.id===editingRecordId) : null;
    let liveScores = existing ? {...existing.scores} : {};
    let liveNotes = existing ? {...(existing.criteriaNotes||{})} : {};

    function renderPrevReviews(){
      const panel = document.getElementById('previousReviewsPanel');
      if(!panel) return;
      const supId = document.getElementById('f_support').value;
      const month = document.getElementById('f_month').value;
      const prior = STATE.records
        .filter(r=>r.supportId===supId && r.month===month && r.id!==editingRecordId)
        .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      if(!prior.length){ panel.innerHTML=''; return; }
      panel.innerHTML = `
        <div class="prev-reviews">
          <div class="prev-title">Already on file for ${monthLabel(month)}</div>
          ${prior.map(p=>`
            <div class="prev-item">
              <span>${fmtDate(p.dateOfEval)} &middot; agent <span class="agent-name">${esc(p.agentName)}</span> &middot; case ${esc(p.caseNumber)}</span>
              <span class="badge ${scoreBadgeClass(p.percent)}">${p.total}/${MAX_SCORE} &middot; ${pctStr(p.percent)}</span>
            </div>`).join('')}
        </div>`;
    }
    renderPrevReviews();
    document.getElementById('f_support').addEventListener('change', renderPrevReviews);
    document.getElementById('f_month').addEventListener('change', renderPrevReviews);

    document.querySelectorAll('[data-score-key]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = btn.dataset.scoreKey, val = parseInt(btn.dataset.scoreVal);
        liveScores[key] = val;
        document.querySelectorAll(`[data-score-key="${key}"]`).forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const card = document.querySelector(`.crit-card[data-crit-key="${key}"]`);
        if(card){
          card.dataset.band = String(val);
          const c = CRITERIA.find(cc=>cc.key===key);
          const ta = card.querySelector('textarea[data-note-key]');
          if(ta) ta.placeholder = notePlaceholder(c, val);
        }
        const total = Object.values(liveScores).reduce((s,v)=>s+v,0);
        document.getElementById('liveTotal').innerHTML = `${total} <small>/ ${MAX_SCORE}</small>`;
        document.getElementById('livePercent').textContent = Math.round((total/MAX_SCORE)*100)+'%';
      });
    });

    document.querySelectorAll('textarea[data-note-key]').forEach(ta=>{
      ta.addEventListener('input', ()=>{ liveNotes[ta.dataset.noteKey] = ta.value; });
    });

    document.querySelectorAll('[data-crit-toggle]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = btn.dataset.critToggle;
        const panel = document.getElementById('critInfo-'+key);
        const isOpen = panel.classList.toggle('open');
        btn.textContent = isOpen ? 'Hide full criteria \u25B4' : 'View full criteria \u25BE';
      });
    });

    const genBtn = document.getElementById('generateSummaryBtn');
    if(genBtn){
      genBtn.addEventListener('click', ()=>{
        if(Object.keys(liveScores).length < CRITERIA.length){
          toast('Score every criterion first \u2014 the summary is built from those ratings.', true);
          return;
        }
        const summary = buildSummary(liveScores, liveNotes);
        document.getElementById('f_supportAction').value = summary.supportAction;
        document.getElementById('f_commitment').value = summary.commitment;
        document.getElementById('f_additional').value = summary.additional;
        document.getElementById('f_tlNotes').value = summary.tlNotes;
        toast('Summary generated');
      });
    }

    document.getElementById('feedbackForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(Object.keys(liveScores).length < CRITERIA.length){
        toast('Please score every criterion before saving.', true);
        return;
      }
      const total = Object.values(liveScores).reduce((s,v)=>s+v,0);
      const percent = total/MAX_SCORE;
      const supportId = document.getElementById('f_support').value;
      const support = STATE.supports.find(s=>s.id===supportId);
      const record = {
        id: editingRecordId || uid('rec'),
        month: document.getElementById('f_month').value || currentMonth,
        supportId, supportName: support?support.name:'',
        dateOfEval: document.getElementById('f_evalDate').value,
        chatDate: document.getElementById('f_chatDate').value,
        agentName: document.getElementById('f_agent').value,
        caseNumber: document.getElementById('f_case').value,
        scores: liveScores, criteriaNotes: liveNotes, total, percent,
        supportAction: document.getElementById('f_supportAction').value,
        commitmentObservations: document.getElementById('f_commitment').value,
        additionalActions: document.getElementById('f_additional').value,
        tlCommitment: document.getElementById('f_tlNotes').value,
        createdAt: editingRecordId ? (existing?.createdAt || Date.now()) : Date.now(),
        updatedAt: Date.now()
      };
      if(editingRecordId){
        const idx = STATE.records.findIndex(r=>r.id===editingRecordId);
        STATE.records[idx] = record;
      } else {
        STATE.records.push(record);
      }
      currentMonth = record.month;
      await saveState();
      toast(editingRecordId ? 'Evaluation updated' : 'Evaluation saved');
      editingRecordId = null;
      setView('records');
    });
    const cancelBtn = document.getElementById('cancelEdit');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingRecordId=null; setView('records'); });
  }

  if(currentView==='records'){
    renderRecordsTable();
    document.getElementById('filterMonth').addEventListener('change', renderRecordsTable);
    document.getElementById('filterSupport').addEventListener('change', renderRecordsTable);
  }

  if(currentView==='agentReviews'){
    renderAllAgentReviewsTable();
    document.getElementById('arFilterSupport').addEventListener('change', renderAllAgentReviewsTable);
    document.getElementById('arFilterKind').addEventListener('change', renderAllAgentReviewsTable);
  }

  if(currentView==='supports'){
    document.getElementById('addSupportForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const inp = document.getElementById('newSupportName');
      const name = inp.value.trim();
      if(!name) return;
      STATE.supports.push({ id: uid('sup'), name });
      await saveState();
      inp.value='';
      render();
      toast('Support added');
    });
    document.querySelectorAll('[data-remove-support]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.removeSupport;
        const sup = STATE.supports.find(s=>s.id===id);
        if(!confirm(`Remove ${sup.name} from the active roster?`)) return;
        STATE.supports = STATE.supports.filter(s=>s.id!==id);
        await saveState();
        render();
        toast('Support removed');
      });
    });

    document.getElementById('downloadBackupBtn').addEventListener('click', downloadBackup);
    document.getElementById('restoreBackupBtn').addEventListener('click', ()=>{
      document.getElementById('restoreFileInput').click();
    });
    document.getElementById('restoreFileInput').addEventListener('change', handleRestoreFile);

    document.getElementById('saveSyncUrlBtn').addEventListener('click', async ()=>{
      const val = document.getElementById('syncUrlInput').value.trim();
      SYNC_URL = val;
      try{ localStorage.setItem(SYNC_URL_KEY, SYNC_URL); }catch(e){}
      if(SYNC_URL){
        toast('Sync URL saved \u2014 syncing now\u2026');
        await syncNow();
        toast(lastSyncStatus==='error' ? 'Saved, but the first sync failed' : 'Connected and synced');
      } else {
        toast('Sync URL cleared');
      }
      render();
    });
    const syncNowBtn = document.getElementById('syncNowBtn');
    if(syncNowBtn){
      syncNowBtn.addEventListener('click', async ()=>{
        toast('Syncing\u2026');
        await syncNow();
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
        toast(lastSyncStatus==='error' ? 'Sync failed' : 'Synced');
        render();
      });
    }
  }
}

function downloadBackup(){
  try{
    const blob = new Blob([JSON.stringify(STATE, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `SEQAS_Review_backup_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('Backup downloaded');
  }catch(e){ toast('Could not create backup file.', true); }
}

function handleRestoreFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed || !Array.isArray(parsed.records) || !Array.isArray(parsed.supports)){
        toast('Invalid backup file.', true);
        return;
      }
      if(!confirm(`Restore this backup? (${parsed.records.length} evaluations, ${parsed.supports.length} supports).`)) return;
      STATE = {
        supports: parsed.supports || [],
        targets: parsed.targets || {},
        records: parsed.records || [],
        seededAugust2026: !!parsed.seededAugust2026,
        deletedCaseNumbers: parsed.deletedCaseNumbers || [],
        augustAccuracyApplied: !!parsed.augustAccuracyApplied,
        agentReviews: parsed.agentReviews || [],
        deletedAgentReviewIds: parsed.deletedAgentReviewIds || []
      };
      const ok = await saveState();
      if(ok){ toast('Backup restored'); render(); }
      else{ toast('Restored here, but save failed', true); render(); }
    }catch(err){ toast('Could not read backup file.', true); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

async function confirmDeleteRecord(id){
  const rec = STATE.records.find(r=>r.id===id);
  if(!rec) return;
  if(!confirm(`Delete evaluation for ${rec.supportName}?`)) return;
  STATE.records = STATE.records.filter(r=>r.id!==id);
  if(rec.caseNumber){
    STATE.deletedCaseNumbers = STATE.deletedCaseNumbers || [];
    if(!STATE.deletedCaseNumbers.includes(String(rec.caseNumber))){
      STATE.deletedCaseNumbers.push(String(rec.caseNumber));
    }
  }
  renderRecordsTable();
  const ok = await saveState();
  if(ok) toast('Evaluation deleted');
}

function generatePdf(r, subject){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const marginX = 48;
    let y = 56;
    const pageWidth = doc.internal.pageSize.getWidth();

    doc.setFillColor(9,60,93);
    doc.rect(0,0,pageWidth,64,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(17);
    doc.text('SEQAS REVIEW', marginX, 34);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.text(`${r.supportName}  |  ${subject.split('|')[1].trim()}`, marginX, 50);

    y = 96;
    doc.setTextColor(28,43,58);

    const kv = [
      ['DATE OF EVALUATION', fmtDate(r.dateOfEval), false],
      ['CHAT DATE', fmtDate(r.chatDate), false],
      ['SUPPORT NAME', r.supportName, false],
      ['AGENT NAME', r.agentName, true],
      ['CASE NUMBER', String(r.caseNumber), false],
      ['REVIEW SCORE', `${r.total}/${MAX_SCORE}  (${Math.round(r.percent*100)}%)`, false],
    ];
    const rowH = 22;
    kv.forEach((pair, i)=>{
      const ry = y + i*rowH;
      doc.setFillColor(i%2===0 ? 234 : 247, i%2===0 ? 244 : 250, i%2===0 ? 251 : 253);
      doc.rect(marginX, ry-14, pageWidth-marginX*2, rowH, 'F');
      doc.setDrawColor(214,229,240);
      doc.rect(marginX, ry-14, pageWidth-marginX*2, rowH, 'S');
      doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.setTextColor(92,98,112);
      doc.text(pair[0], marginX+10, ry);
      doc.setFont('helvetica', pair[2] ? 'italic' : 'normal'); doc.setFontSize(11);
      doc.setTextColor(28,43,58);
      doc.text(String(pair[1]), marginX+190, ry);
    });
    y = y + kv.length*rowH + 24;

    const sections = [
      ['Support Action', r.supportAction],
      ['Commitment Met / Observations', r.commitmentObservations],
      ['Additional Actions That Could Be Performed', r.additionalActions],
      ['TL Commitment and Coaching Notes', r.tlCommitment],
    ];
    sections.forEach(([title, body])=>{
      if(y > 740){ doc.addPage(); y = 56; }
      doc.setDrawColor(59,117,151);
      doc.setLineWidth(1.4);
      doc.line(marginX, y, marginX+34, y);
      doc.setFont('helvetica','bold'); doc.setFontSize(12.5);
      doc.setTextColor(28,43,58);
      doc.text(title, marginX, y-6);
      y += 16;
      doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
      doc.setTextColor(28,43,58);
      const lines = doc.splitTextToSize(body && body.trim() ? body : '\u2014', pageWidth - marginX*2);
      lines.forEach(line=>{
        if(y > 780){ doc.addPage(); y = 56; }
        doc.text(line, marginX, y);
        y += 14;
      });
      y += 16;
    });

    const fname = `SEQAS_${r.supportName.replace(/\s+/g,'_')}_${r.month}.pdf`;
    doc.save(fname);
    toast('PDF downloaded');
  }catch(e){
    toast('Could not generate PDF', true);
  }
}

async function init(){
  const ok = await loadState();
  if(!ok){
    alert('Local storage is not accessible in this browser session.');
    return;
  }
  document.getElementById('globalMonth').addEventListener('change', (e)=>{ currentMonth = e.target.value; render(); });
  document.getElementById('saveStatus').addEventListener('click', ()=>{
    if(document.getElementById('saveStatus').classList.contains('error')) saveState();
  });
  if(STATE.records.some(r=>r.month==='2026-08')) currentMonth = '2026-08';
  setView('dashboard');
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';

  setInterval(async ()=>{
    if(!SYNC_URL) return;
    if(currentView==='new') return;
    const before = JSON.stringify(STATE);
    await syncNow();
    if(JSON.stringify(STATE) !== before) render();
  }, 45000);
}
init();
</script>
</body>
</html>
